name: Docs

on:
  push:
    branches: [ premain, main ]
  pull_request:
    branches: [ premain, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-lint-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Lint exported doc comments (revive)
        run: |
          make doclint

      - name: Generate godoc text
        run: |
          make godoc-text

      - name: Upload godoc.txt artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godoc.txt
          path: docs/godoc.txt
