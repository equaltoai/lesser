name: Test

on:
  push:
    branches: [ premain, main ]
  pull_request:
    branches: [ premain, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ['1.23.x', '1.24.x', '1.25.x']
    
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      with:
        fetch-depth: 1
        persist-credentials: false
    
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache: true
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests (limited packages)
      run: make test-coverage
    
    - name: Upload coverage reports
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
    
    - name: Run benchmarks
      run: go test -bench=. -benchmem ./pkg/... || true

  cdk-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      with:
        fetch-depth: 1
        persist-credentials: false
    
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
      with:
        go-version: '1.25.x'
        check-latest: true
        cache: true
    
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
    
    - name: Install AWS CDK
      run: npm install -g aws-cdk@2
    
    - name: Download Go dependencies
      run: go mod download
    
    - name: Prepare CDK assets (dummy)
      run: |
        # Create placeholder asset directory expected by examples
        mkdir -p pkg/cdk/lambda
        echo "placeholder" > pkg/cdk/lambda/README.md
    
    - name: Test CDK constructs compilation
      run: |
        cd pkg/cdk/examples/basic-api
        go build -o /dev/null main.go
    
    - name: Synthesize CDK stacks
      run: |
        cd pkg/cdk/examples/basic-api
        cdk synth --quiet
    
    - name: Run CDK tests
      run: |
        go test -v ./pkg/cdk/...

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      with:
        fetch-depth: 1
        persist-credentials: false
    
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
      with:
        go-version: '1.25.x'
        check-latest: true
        cache: true
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
      with:
        version: v2.4.0
        args: --timeout=5m --config=.golangci.yml
        only-new-issues: false
        skip-cache: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      with:
        fetch-depth: 1
        persist-credentials: false
    
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
      with:
        go-version: '1.25.x'
        check-latest: true
        cache: true
    
    - name: Build library packages only
      run: |
        GOOS=linux GOARCH=${{ matrix.arch }} go build -v ./pkg/...
