environment: production
appName: lesser
domain: lesser.host
memorySize: 3008
timeout: 30
logLevel: INFO
features:
  enableMultiTenant: false
  enableRateLimiting: true
  enableMonitoring: true
  enableDeletionProtection: true
  enablePointInTimeRecovery: true
aws:
  region: us-east-1
  architecture: arm64
  runtime: provided.al2023
monitoring:
  detailedMetrics: true
  businessMetrics: true
  realTimeStreaming: false
  errorRateThreshold: 1.0
  latencyP99Threshold: 3000
  throttleCountThreshold: 10
  concurrentExecutionsThreshold: 100
cost:
  optimized: false
  reservedConcurrency: 0
media:
  sourceBucket: lesser-media-production
  streamingBucket: lesser-streaming-production
  cloudfrontDomain: cdn.lesser.host
  cloudfrontKeyPairId: ""  # To be configured manually
  cloudfrontPrivateKeySecret: lesser/cloudfront-private-key-production
  mediaConvertEndpoint: ""  # To be configured per region
  mediaConvertRole: ""  # Generated by CDK
  manifestTTLHours: 72
ml:
  trainingBucket: lesser-training-production
  modelMetadataTable: lesser-production  # Uses main table with GSI9
  bedrockRegion: us-east-1
  bedrockModelId: amazon.titan-text-lite-v1
  bedrockInferenceModelId: ""  # Custom trained model ID when available