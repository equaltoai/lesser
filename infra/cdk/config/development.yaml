environment: development
appName: lesser
domain: dev.lesser.host
memorySize: 512
timeout: 30
logLevel: DEBUG
features:
  enableMultiTenant: false
  enableRateLimiting: true
  enableMonitoring: true
  enableDeletionProtection: false
  enablePointInTimeRecovery: false
aws:
  region: us-east-1
  architecture: arm64
  runtime: provided.al2023
monitoring:
  detailedMetrics: false
  businessMetrics: false
  realTimeStreaming: false
cost:
  optimized: true
  reservedConcurrency: 0
media:
  sourceBucket: lesser-media-development
  streamingBucket: lesser-streaming-development
  cloudfrontDomain: cdn-dev.lesser.host
  cloudfrontKeyPairId: ""  # To be configured manually
  cloudfrontPrivateKeySecret: lesser/cloudfront-private-key-development
  mediaConvertEndpoint: ""  # To be configured per region
  mediaConvertRole: ""  # Generated by CDK
  manifestTTLHours: 24
ml:
  trainingBucket: lesser-training-development
  modelMetadataTable: lesser-development  # Uses main table with GSI9
  bedrockRegion: us-east-1
  bedrockModelId: amazon.titan-text-lite-v1
  bedrockInferenceModelId: ""  # Custom trained model ID when available
  bedrockCustomizationRoleArn: "arn:aws:iam::ACCOUNT_ID:role/LesserBedrockCustomizationRole"  # IAM role for Bedrock training jobs (REPLACE ACCOUNT_ID)
  bedrockGuardrailId: ""  # Optional: Bedrock guardrail ID
  bedrockGuardrailVersion: "DRAFT"  # Guardrail version
  moderationMLEnabled: "true"  # Feature flag for ML moderation
  moderationMLTenants: ""  # Comma-separated tenant IDs allowed to use ML features