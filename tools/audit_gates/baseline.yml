  pkg/storage/repositories/federation_activity_repository.go: 1
  pkg/storage/repositories/filter_repository.go: 1
  pkg/storage/repositories/hashtag_trending_engine.go: 1
  pkg/storage/repositories/instance_counts.go: 5
  pkg/storage/repositories/instance_health_repository.go: 1
  pkg/storage/repositories/media_repository.go: 1
  pkg/storage/repositories/moderation_repository.go: 9
  pkg/storage/repositories/notification_repository.go: 1
  pkg/storage/repositories/object_repository.go: 1
  pkg/storage/repositories/rate_limit_repository.go: 1
