# Exact occurrences of partition-key prefix/range predicates in `.Where(...)` (tracked by count per file).
# Partition keys must be queried by equality; prefix/range predicates force scans.
# Wave part 2 (batch A, #1469): the last baselined site — analytics_repository.go
# queryQualityChangeEvents (`Where("PK","begins_with","QUALITY_CHANGE#")`) — was
# eliminated (GSI3 media-keyed query), so this gate is back to zero.
goDynamoDBBadPKWhere:
  {}

# Key-less TableTheory `All(...)` on freshly-built query chains (a Model(...)/
# WithContext(...) chain with no partition-key equality condition), which
# compiles to a DynamoDB Scan with no key condition (tracked by count per
# file). A Where(...) filter that does not bind a partition key (sort-key
# ranges, non-key attribute predicates, partition-key operators other than
# "=") does NOT bound the query and is still counted — the gate gap where any
# Where suppressed detection was closed 2026-08-26 under umbrella #1469
# (wave part 1). All(...) chained onto a pre-built query variable, or a chain
# whose Where(...) field/operator is not a string literal, is statically
# indeterminate and deliberately not flagged.
#
# Model-blind key trust (disclosed 2026-08-26, wave part 1 rework): the
# detector treats a literal Where("PK"/"gsiNPK"/"oauthClientsPK", "=", ...) as
# a bound without checking the model declares the index — ~250 unflagged sites
# rely on the uniform lowercase naming convention the models actually write.
# Indeterminate sites (non-literal field/operator) are never flagged; of the 5
# inspected during closure, 2 are runtime GSI partition-key queries
# (alert_repository.go:181, metrics_repository.go:591 — callers pass matching
# index/field config) and 3 were production-unused helpers
# (base_repository.go QueryHistoryWithDateRange / QueryMetricsByTimeRange /
# FindBySK) deleted in this PR. See docs/architecture/dynamodb-scan-inventory.md.
#
# Dispositions (see docs/architecture/dynamodb-scan-inventory.md):
# - pkg/storage/repositories/instance_counts.go: 5 — DELIBERATE offline-only
#   tooling: the 5 bounded recount reads (key-only projections of the offline
#   `lesser recount-instance-counts` tool: users, actors, domain counters,
#   activities, existing day counters). The 3 request-adjacent lazy seed scans
#   (TOTAL_USERS, TOTAL_DOMAINS, active_month) were REMOVED in PR #1476 — no
#   scan may run on any request path, marker-gated or not (operator doctrine
#   2026-08-26).
# - Wave part 2 (batch A, umbrella #1469, 2026-08-27) eliminated 13 request-
#   adjacent key-less All sites: graph/query_resolvers_cms.go (2 fallback scans
#   deleted), activity_repository.go (dead GetWeeklyActivity deleted),
#   analytics_repository.go (queryQualityChangeEvents → GSI3),
#   announcement_repository.go (dismissal cleanup → GSI1),
#   enhanced_pattern_repository.go (GetPatternStatistics → GSI4),
#   moderation_repository.go (5: GetReviewerStats → GSI1, filter keyword/entity
#   CRUD → filterID point ops, GetModerationPatterns → GSI3),
#   rate_limit_repository.go (ClearAPIRateLimitsForUser → GSI1),
#   scheduled_status_repository.go (GetScheduledStatus → GSI2).
# - Wave part 2 (batch E, umbrella #1469, 2026-08-27) eliminated 10 more
#   event-path key-less All sites: moderation_repository.go GetPendingModerationCount
#   (3: reports by assignee → new GSI4 assignee key on Report, flags → keyed
#   GSI2 FLAG_STATUS#pending preserving the never-matching assignee filter),
#   analytics_repository.go GetRecentStatusesWithEngagement / GetRecentLinks
#   (2 → new GSI1 global listing keys on StatusEngagement / LinkShare),
#   federation_activity_repository.go GetRecentActivities
#   (→ new GSI3 global listing key on FederationActivity),
#   cost/repository_adapter.go ListInstanceConfigs (→ new GSI3 global listing
#   key on FederationInstanceConfigTracking), threat_intel_repository.go
#   LoadActiveThreats (→ existing GSI2 THREATS key),
#   instance_health_repository.go GetUnhealthyInstances (→ new GSI1
#   HEALTH_SUMMARY#1h key on InstanceHealthSummary), notification_repository.go
#   DeleteNotificationsByObject (→ new GSI5 NOTIF_OBJECT#<targetID> key on
#   Notification; the previous ObjectID filter matched nothing — Notification
#   references objects via TargetID, so the cascade now performs the intended
#   delete). GetRecentHashtags / getCandidateHashtags were first rerouted to a
#   new Hashtag GSI1 HASHTAGS#ALL key and then REVERTED to these baselined
#   scans in the batch E rework (2026-08-27): Hashtag metadata rows are only
#   written by HashtagRepository.IndexHashtag, which has zero production
#   callers, so no live writer would populate the index — the reads stay on
#   SK = METADATA scans with a no-live-writer disposition.
# - Wave part 2 (batch L, umbrella #1469, 2026-08-27) eliminated 10 LATENT-class
#   key-less All sites: analytics_repository.go GetActorInteraction (2, deleted —
#   zero callers; analytics_repository.go drops 3 → 1, leaving GetRecentHashtags
#   with the batch E no-live-writer disposition), account_repository_auth.go
#   GetUserByRecoveryCode (deleted — zero callers), account_repository_refresh_tokens.go
#   CleanupExpiredAdvancedTokens (deleted — zero callers), activity_repository.go
#   GetHashtagActivity (bounded — page-capped AllPaginated iteration, Limit 500/page,
#   max 100 pages), dlq_repository.go GetSimilarMessages (deleted — zero callers;
#   interface/mock/inmemory dropped), enhanced_pattern_repository.go
#   CleanupExpiredPatterns (deleted — zero callers), media_repository.go
#   GetTotalStorageUsage (bounded — page-capped AllPaginated iteration, Limit
#   500/page, max 100 pages; the two media sites invisible to this gate,
#   GetUnusedMedia/GetModerationPendingMedia, are clamped in place), search_cost_repository.go
#   GetPopularQueries + ResetBudgets (deleted — zero callers), search_repository.go
#   PruneOldSuggestions + UnindexStatus (deleted — zero callers; wrapper forwards
#   dropped).
# - moderation_repository.go GetFlag (1) REMAINS baselined but is NOT latent:
#   it is reached from the event path via DeleteFlag ← cmd/activity-processor
#   (flag-undo handling). It is already bounded (Limit 10 on the SK LIKE
#   suffix lookup — no existing index serves a flag-ID lookup without the
#   object key) and stays for the request/event-path batch.
# - The other 8 calls are pre-existing unkeyed scans baselined for tracking,
#   scheduled for elimination under the same umbrella issue (disposition:
#   "elimination pending — wave #1469", NOT sanctioned).
goDynamoDBAllNoKey:
  pkg/storage/repositories/analytics_repository.go: 1
  pkg/storage/repositories/filter_repository.go: 1
  pkg/storage/repositories/hashtag_trending_engine.go: 1
  pkg/storage/repositories/instance_counts.go: 5
  pkg/storage/repositories/moderation_repository.go: 1
  pkg/storage/repositories/object_repository.go: 1

# Key-less TableTheory `Count(...)` on freshly-built query chains, which
# compiles to a DynamoDB Scan with Select=COUNT — a counted full-table/index
# scan the All-only gate could not see. Count() shares All()'s compile path
# (tabletheory v3.0.6 pkg/query/query_execution.go:80-111: Compile() decides
# Query vs Scan, then ExecuteScan runs the count). The same key-condition,
# indeterminate, and model-blind-trust rules as goDynamoDBAllNoKey apply
# (tracked by count per file). Gate added 2026-08-26 (wave part 1 rework).
#
# Dispositions (see docs/architecture/dynamodb-scan-inventory.md):
# - pkg/storage/theorydb/patterns/soft_delete.go: 2 — SoftDeleteRepository.
#   GetSoftDeleteStats counts total items (:323) and soft-deleted items
#   (:330) with full-table counted scans. ENUMERATION ONLY in this PR — the
#   site is NOT modified; disposition "elimination pending — wave #1469".
goDynamoDBCountNoKey:
  pkg/storage/theorydb/patterns/soft_delete.go: 2

