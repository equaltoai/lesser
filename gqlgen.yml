# Where are all the schema files located? globs are supported eg  src/**/*.graphqls
schema:
  - graph/*.graphql

# Where should the generated server code go?
exec:
  package: graph
  layout: single-file
  filename: graph/generated.go

# Where should any generated models go?
model:
  filename: graph/model/models_gen.go
  package: model

# Resolver generation is disabled while we manage resolver files manually
# resolver:
#   package: graph
#   layout: follow-schema
#   dir: graph
#   filename_template: "{name}.resolvers.go"

# Optional: turn on use `gqlgen:"fieldName"` tags in your models
struct_tag: json

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.
autobind:
  - "github.com/equaltoai/lesser/pkg/activitypub"
  - "github.com/equaltoai/lesser/pkg/mastodon"
  - "github.com/equaltoai/lesser/pkg/moderation"
  - "github.com/equaltoai/lesser/pkg/trust"
  - "github.com/equaltoai/lesser/pkg/cost"

# This section declares type mapping between the GraphQL and go type systems
models:
  Time:
    model:
      - github.com/equaltoai/lesser/graph/model.Time
  Cursor:
    model:
      - github.com/equaltoai/lesser/graph/model.Cursor
  Duration:
    model:
      - github.com/equaltoai/lesser/graph/model.Duration
  Upload:
    model:
      - github.com/99designs/gqlgen/graphql.Upload
