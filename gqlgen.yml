# Where are all the schema files located? globs are supported eg  src/**/*.graphqls
schema:
  - graph/core.graphql
  - graph/phase1.graphql
  - graph/phase2.graphql
  - graph/phase3.graphql
  - graph/agents.graphql

# Where should the generated server code go?
exec:
  package: graph
  layout: single-file
  filename: graph/generated.go

# Where should any generated models go?
model:
  filename: graph/model/models_gen.go
  package: model

# Resolver generation is disabled while we manage resolver files manually
# resolver:
#   package: graph
#   layout: follow-schema
#   dir: graph
#   filename_template: "{name}.resolvers.go"

# Optional: turn on use `gqlgen:"fieldName"` tags in your models
struct_tag: json

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.
autobind:
  - "github.com/equaltoai/lesser/pkg/activitypub"
  - "github.com/equaltoai/lesser/pkg/mastodon"
  - "github.com/equaltoai/lesser/pkg/moderation"
  - "github.com/equaltoai/lesser/pkg/trust"
  - "github.com/equaltoai/lesser/pkg/cost"

# This section declares type mapping between the GraphQL and go type systems
models:
  Time:
    model:
      - github.com/equaltoai/lesser/graph/model.Time
  Cursor:
    model:
      - github.com/equaltoai/lesser/graph/model.Cursor
  AgentAccessLease:
    model:
      - github.com/equaltoai/lesser/graph/model.AgentAccessLease
  AgentAccessLeaseChallenge:
    model:
      - github.com/equaltoai/lesser/graph/model.AgentAccessLeaseChallenge
  AgentAccessLeaseTokenPayload:
    model:
      - github.com/equaltoai/lesser/graph/model.AgentAccessLeaseTokenPayload
  AgentAccessLeaseChallengeInput:
    model:
      - github.com/equaltoai/lesser/graph/model.AgentAccessLeaseChallengeInput
  CreateAgentAccessLeaseInput:
    model:
      - github.com/equaltoai/lesser/graph/model.CreateAgentAccessLeaseInput
  RevokeAgentAccessLeaseInput:
    model:
      - github.com/equaltoai/lesser/graph/model.RevokeAgentAccessLeaseInput
  AgentAccessLeaseSessionKeyChallengeInput:
    model:
      - github.com/equaltoai/lesser/graph/model.AgentAccessLeaseSessionKeyChallengeInput
  AuthorizeAgentAccessLeaseSessionKeyInput:
    model:
      - github.com/equaltoai/lesser/graph/model.AuthorizeAgentAccessLeaseSessionKeyInput
  ExchangeAgentAccessLeaseTokenInput:
    model:
      - github.com/equaltoai/lesser/graph/model.ExchangeAgentAccessLeaseTokenInput
  Agent:
    fields:
      identitySemantics:
        resolver: true
      workflow:
        resolver: true
  Duration:
    model:
      - github.com/equaltoai/lesser/graph/model.Duration
  Upload:
    model:
      - github.com/99designs/gqlgen/graphql.Upload
  # CMS (phase 1)
  ContentFormat:
    model:
      - github.com/equaltoai/lesser/graph/model.ContentFormat
  DraftStatus:
    model:
      - github.com/equaltoai/lesser/graph/model.DraftStatus
  ChangeType:
    model:
      - github.com/equaltoai/lesser/graph/model.ChangeType
  PublicationRole:
    model:
      - github.com/equaltoai/lesser/graph/model.PublicationRole
  TOCEntry:
    model:
      - github.com/equaltoai/lesser/graph/model.TOCEntry
  Article:
    model:
      - github.com/equaltoai/lesser/graph/model.Article
  ArticleEdge:
    model:
      - github.com/equaltoai/lesser/graph/model.ArticleEdge
  ArticleConnection:
    model:
      - github.com/equaltoai/lesser/graph/model.ArticleConnection
  Draft:
    model:
      - github.com/equaltoai/lesser/graph/model.Draft
  DraftEdge:
    model:
      - github.com/equaltoai/lesser/graph/model.DraftEdge
  DraftConnection:
    model:
      - github.com/equaltoai/lesser/graph/model.DraftConnection
  Revision:
    model:
      - github.com/equaltoai/lesser/graph/model.Revision
  RevisionEdge:
    model:
      - github.com/equaltoai/lesser/graph/model.RevisionEdge
  RevisionConnection:
    model:
      - github.com/equaltoai/lesser/graph/model.RevisionConnection
  Series:
    model:
      - github.com/equaltoai/lesser/graph/model.Series
  SeriesEdge:
    model:
      - github.com/equaltoai/lesser/graph/model.SeriesEdge
  SeriesConnection:
    model:
      - github.com/equaltoai/lesser/graph/model.SeriesConnection
  Category:
    model:
      - github.com/equaltoai/lesser/graph/model.Category
  Publication:
    model:
      - github.com/equaltoai/lesser/graph/model.Publication
  PublicationMember:
    model:
      - github.com/equaltoai/lesser/graph/model.PublicationMember
  CreateDraftInput:
    model:
      - github.com/equaltoai/lesser/graph/model.CreateDraftInput
  UpdateDraftInput:
    model:
      - github.com/equaltoai/lesser/graph/model.UpdateDraftInput
  CreateArticleInput:
    model:
      - github.com/equaltoai/lesser/graph/model.CreateArticleInput
  UpdateArticleInput:
    model:
      - github.com/equaltoai/lesser/graph/model.UpdateArticleInput
  CreateSeriesInput:
    model:
      - github.com/equaltoai/lesser/graph/model.CreateSeriesInput
  UpdateSeriesInput:
    model:
      - github.com/equaltoai/lesser/graph/model.UpdateSeriesInput
  CreateCategoryInput:
    model:
      - github.com/equaltoai/lesser/graph/model.CreateCategoryInput
  UpdateCategoryInput:
    model:
      - github.com/equaltoai/lesser/graph/model.UpdateCategoryInput
  CreatePublicationInput:
    model:
      - github.com/equaltoai/lesser/graph/model.CreatePublicationInput
  UpdatePublicationInput:
    model:
      - github.com/equaltoai/lesser/graph/model.UpdatePublicationInput
  Object:
    fields:
      viewerFavourited:
        resolver: true
      viewerBookmarked:
        resolver: true
      viewerPinned:
        resolver: true
