name: ci

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGE: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: auth-ui/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # CI manages the build cache explicitly under tmp/go-cache after
          # setup-go. Keeping setup-go's default cache enabled also restores
          # /home/runner/.cache/go-build, duplicating several GiB of cache data
          # and leaving the verify job without enough runner disk headroom.
          cache: false

      - name: Configure Go build cache
        run: |
          # Keep GOCACHE inside the workspace for this job, but do not restore
          # it from actions/cache. The cross-run Go build cache has grown large
          # enough to expand to tens of GiB and exhaust some GitHub-hosted
          # runners before the verify gate starts.
          echo "GOCACHE=$GITHUB_WORKSPACE/tmp/go-cache/go${{ steps.setup-go.outputs.go-version }}" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/tmp/go-cache/go${{ steps.setup-go.outputs.go-version }}"

      - name: Disk usage (post setup-go)
        run: bash scripts/ci_disk_usage.sh "post setup-go"

      - name: Cache Lesser XDG caches
        uses: actions/cache@v5
        with:
          path: |
            tmp/xdg-cache/go${{ steps.setup-go.outputs.go-version }}
          key: ${{ runner.os }}-lesser-xdg-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'infra/cdk/go.mod', 'infra/cdk/go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-lesser-xdg-go${{ steps.setup-go.outputs.go-version }}-

      - name: Disk usage (post XDG cache restore)
        run: bash scripts/ci_disk_usage.sh "post XDG cache restore"

      - name: Install Go tools
        run: bash scripts/install_ci_tools.sh

      - name: Build lesser CLI
        run: go build -o lesser ./cmd/lesser

      - name: Build lambda artifacts
        run: ./lesser build lambdas

      - name: Disk usage (post lambda build)
        run: bash scripts/ci_disk_usage.sh "post lambda build"

      - name: Verify (CI gate)
        run: ./lesser verify ci

      - name: Install auth-ui dependencies
        working-directory: auth-ui
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: auth-ui
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Type-check auth-ui tests
        working-directory: auth-ui
        run: corepack pnpm exec tsc --noEmit -p tsconfig.json

      - name: Run auth-ui browser suite
        working-directory: auth-ui
        run: corepack pnpm test:e2e

      - name: Verify artifact-driven deploy certification
        run: bash scripts/verify_artifact_deploy.sh

      - name: Disk usage (post verify)
        if: always()
        run: bash scripts/ci_disk_usage.sh "post verify"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: report/
          if-no-files-found: ignore
