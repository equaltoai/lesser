name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGE: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: |
            go.sum
            infra/cdk/go.sum

      - name: Disk usage (post setup-go)
        run: bash scripts/ci_disk_usage.sh "post setup-go"

      - name: Install Go tools
        run: bash scripts/install_ci_tools.sh

      - name: Cache Lesser XDG caches
        uses: actions/cache@v4
        with:
          path: |
            tmp/xdg-cache/go1.25.7
          key: ${{ runner.os }}-lesser-xdg-go1.25.7-${{ hashFiles('go.mod', 'go.sum', 'infra/cdk/go.mod', 'infra/cdk/go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-lesser-xdg-go1.25.7-

      - name: Disk usage (post xdg cache restore)
        run: bash scripts/ci_disk_usage.sh "post xdg cache restore"

      - name: Build lesser CLI
        run: go build -o lesser ./cmd/lesser

      - name: Build lambda artifacts
        run: ./lesser build lambdas

      - name: Disk usage (post lambda build)
        run: bash scripts/ci_disk_usage.sh "post lambda build"

      - name: Verify (CI gate)
        run: ./lesser verify ci

      - name: Disk usage (post verify)
        if: always()
        run: bash scripts/ci_disk_usage.sh "post verify"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: report/
          if-no-files-found: ignore
