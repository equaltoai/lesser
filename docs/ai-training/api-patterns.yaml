# API Patterns for Lesser
# Version: 1.0.0
# Purpose: Train AI on API implementation and integration patterns

context:
  description: "API patterns for REST, GraphQL, and WebSocket interfaces"
  api_types:
    - rest: "Mastodon-compatible REST API"
    - graphql: "Modern GraphQL with subscriptions"
    - websocket: "Real-time streaming updates"
    - federation: "ActivityPub protocol endpoints"
  principles:
    - compatibility_first: "Maintain Mastodon API compatibility"
    - unified_business_logic: "Share services across API types"
    - cost_tracking: "Track cost per API operation"
    - rate_limiting: "Protect against abuse"

rest_api_patterns:
  
  endpoint_implementation:
    pattern_name: "REST Endpoint Pattern"
    
    handler_structure:
      location: "cmd/api/lift/handlers.go"
      pattern: |
        func (h *Handler) HandleEndpoint(ctx *lift.Context) error {
            // 1. Parse and validate input
            var req RequestType
            if err := ctx.ValidateAndBind(&req); err != nil {
                return lift.NewLiftError("VALIDATION_ERROR", err.Error(), 400)
            }
            
            // 2. Check authentication
            user, err := h.authService.ValidateToken(ctx.Request.Headers["Authorization"])
            if err != nil {
                return lift.NewLiftError("UNAUTHORIZED", "Invalid token", 401)
            }
            
            // 3. Check rate limits
            if err := h.rateLimiter.Check(ctx, user.ID, "endpoint_name"); err != nil {
                return lift.NewLiftError("RATE_LIMITED", "Too many requests", 429)
            }
            
            // 4. Call service layer
            result, err := h.services.Feature.Execute(ctx.Context(), user, req)
            if err != nil {
                return h.handleServiceError(err)
            }
            
            // 5. Track costs
            h.costTracker.Track(ctx.Context(), "endpoint_name", 0.0001)
            
            // 6. Return response
            return ctx.JSON(200, result)
        }
        
    error_handling:
      pattern: |
        func (h *Handler) handleServiceError(err error) error {
            switch {
            case errors.Is(err, ErrNotFound):
                return lift.NewLiftError("NOT_FOUND", "Resource not found", 404)
            case errors.Is(err, ErrForbidden):
                return lift.NewLiftError("FORBIDDEN", "Access denied", 403)
            case errors.Is(err, ErrValidation):
                return lift.NewLiftError("VALIDATION_ERROR", err.Error(), 422)
            default:
                h.logger.Error("Service error", zap.Error(err))
                return lift.NewLiftError("INTERNAL_ERROR", "Internal server error", 500)
            }
        }

  mastodon_compatibility:
    pattern_name: "Mastodon API Compatibility"
    
    response_format:
      account_object: |
        {
          "id": "123456789",
          "username": "alice",
          "acct": "alice@domain.com",
          "display_name": "Alice",
          "locked": false,
          "bot": false,
          "created_at": "2024-01-01T00:00:00.000Z",
          "note": "<p>Bio content</p>",
          "url": "https://domain.com/@alice",
          "avatar": "https://cdn.domain.com/avatars/alice.jpg",
          "avatar_static": "https://cdn.domain.com/avatars/alice.jpg",
          "header": "https://cdn.domain.com/headers/alice.jpg",
          "header_static": "https://cdn.domain.com/headers/alice.jpg",
          "followers_count": 100,
          "following_count": 50,
          "statuses_count": 500
        }
        
      status_object: |
        {
          "id": "987654321",
          "created_at": "2024-01-01T12:00:00.000Z",
          "in_reply_to_id": null,
          "in_reply_to_account_id": null,
          "sensitive": false,
          "spoiler_text": "",
          "visibility": "public",
          "language": "en",
          "uri": "https://domain.com/users/alice/statuses/987654321",
          "url": "https://domain.com/@alice/987654321",
          "replies_count": 0,
          "reblogs_count": 0,
          "favourites_count": 0,
          "content": "<p>Status content</p>",
          "account": { /* account object */ },
          "media_attachments": [],
          "mentions": [],
          "tags": [],
          "emojis": [],
          "card": null,
          "poll": null
        }

  pagination_patterns:
    pattern_name: "API Pagination"
    
    cursor_based:
      request: "GET /api/v1/timelines/home?max_id=123&limit=20"
      response_headers: |
        Link: <https://domain.com/api/v1/timelines/home?max_id=100>; rel="next",
              <https://domain.com/api/v1/timelines/home?since_id=150>; rel="prev"
      implementation: |
        func paginate(ctx *lift.Context, query func(cursor string, limit int) ([]Item, string)) error {
            maxID := ctx.Request.Query["max_id"]
            sinceID := ctx.Request.Query["since_id"]
            limit := parseLimit(ctx.Request.Query["limit"], 20, 40)
            
            items, nextCursor := query(maxID, limit)
            
            // Build Link header
            links := []string{}
            if nextCursor != "" {
                links = append(links, fmt.Sprintf("<%s?max_id=%s>; rel=\"next\"", baseURL, nextCursor))
            }
            if sinceID != "" {
                links = append(links, fmt.Sprintf("<%s?since_id=%s>; rel=\"prev\"", baseURL, items[0].ID))
            }
            
            ctx.Response.Headers["Link"] = strings.Join(links, ", ")
            return ctx.JSON(200, items)
        }

graphql_api_patterns:
  
  resolver_implementation:
    pattern_name: "GraphQL Resolver Pattern"
    
    query_resolver:
      location: "graph/resolver.go"
      pattern: |
        func (r *queryResolver) Status(ctx context.Context, id string) (*model.Status, error) {
            // 1. Extract user from context
            user := auth.UserFromContext(ctx)
            if user == nil {
                return nil, errors.New("unauthorized")
            }
            
            // 2. Use DataLoader to prevent N+1
            return r.loaders.StatusLoader.Load(ctx, id)
        }
        
        func (r *queryResolver) Timeline(ctx context.Context, timelineType model.TimelineType, limit *int) ([]*model.Status, error) {
            // 1. Authentication
            user := auth.UserFromContext(ctx)
            if user == nil && timelineType != model.TimelineTypePublic {
                return nil, errors.New("unauthorized")
            }
            
            // 2. Apply defaults
            if limit == nil || *limit > 100 {
                defaultLimit := 20
                limit = &defaultLimit
            }
            
            // 3. Call service
            return r.services.Timeline.Get(ctx, user, timelineType, *limit)
        }
        
    mutation_resolver:
      pattern: |
        func (r *mutationResolver) CreateStatus(ctx context.Context, input model.CreateStatusInput) (*model.Status, error) {
            // 1. Authentication required
            user := auth.UserFromContext(ctx)
            if user == nil {
                return nil, errors.New("unauthorized")
            }
            
            // 2. Validate input
            if err := validateStatusInput(input); err != nil {
                return nil, err
            }
            
            // 3. Track cost
            costTracker := cost.FromContext(ctx)
            costTracker.Track("graphql.createStatus", 0.0002)
            
            // 4. Execute business logic
            status, err := r.services.Status.Create(ctx, user, input)
            if err != nil {
                return nil, err
            }
            
            // 5. Emit real-time event
            r.publisher.Publish(ctx, "status.created", status)
            
            return status, nil
        }
        
    subscription_resolver:
      pattern: |
        func (r *subscriptionResolver) TimelineUpdates(ctx context.Context, timelineType model.TimelineType) (<-chan *model.Status, error) {
            // 1. Authentication
            user := auth.UserFromContext(ctx)
            if user == nil {
                return nil, errors.New("unauthorized")
            }
            
            // 2. Create channel
            ch := make(chan *model.Status, 1)
            
            // 3. Subscribe to events
            sub := r.publisher.Subscribe(ctx, fmt.Sprintf("timeline.%s.%s", user.ID, timelineType))
            
            // 4. Stream events
            go func() {
                defer close(ch)
                for event := range sub {
                    if status, ok := event.(*model.Status); ok {
                        select {
                        case ch <- status:
                        case <-ctx.Done():
                            return
                        }
                    }
                }
            }()
            
            return ch, nil
        }

  dataloader_patterns:
    pattern_name: "DataLoader for N+1 Prevention"
    
    implementation:
      location: "graph/dataloader.go"
      pattern: |
        func NewStatusLoader(repo *repositories.StatusRepository) *dataloader.Loader {
            return dataloader.NewBatchedLoader(
                func(ctx context.Context, keys []string) []*dataloader.Result {
                    // Batch load all statuses
                    statuses, err := repo.BatchGet(ctx, keys)
                    if err != nil {
                        return makeErrors(len(keys), err)
                    }
                    
                    // Map results to preserve order
                    statusMap := make(map[string]*model.Status)
                    for _, status := range statuses {
                        statusMap[status.ID] = status
                    }
                    
                    // Return in requested order
                    results := make([]*dataloader.Result, len(keys))
                    for i, key := range keys {
                        if status, ok := statusMap[key]; ok {
                            results[i] = &dataloader.Result{Data: status}
                        } else {
                            results[i] = &dataloader.Result{Error: ErrNotFound}
                        }
                    }
                    
                    return results
                },
                dataloader.WithCache(&dataloader.InMemoryCache{}),
                dataloader.WithWait(2*time.Millisecond),
                dataloader.WithBatchCapacity(100),
            )
        }

websocket_patterns:
  
  connection_management:
    pattern_name: "WebSocket Connection Handling"
    
    connection_handler:
      location: "cmd/streaming/main.go"
      pattern: |
        func handleConnection(ctx *lift.Context) error {
            connectionID := ctx.Request.RequestContext.ConnectionID
            
            // 1. Authenticate connection
            token := ctx.Request.Query["access_token"]
            user, err := authService.ValidateToken(token)
            if err != nil {
                return closeConnection(connectionID, "unauthorized")
            }
            
            // 2. Store connection
            connection := &models.Connection{
                PK:         fmt.Sprintf("CONNECTION#%s", connectionID),
                SK:         "METADATA",
                ID:         connectionID,
                UserID:     user.ID,
                ConnectedAt: time.Now(),
            }
            
            if err := repo.SaveConnection(connection); err != nil {
                return err
            }
            
            // 3. Track cost
            costTracker.StartConnection(connectionID)
            
            return ctx.JSON(200, map[string]string{"status": "connected"})
        }
        
    message_handler:
      pattern: |
        func handleMessage(ctx *lift.Context) error {
            var msg WebSocketMessage
            if err := json.Unmarshal(ctx.Request.Body, &msg); err != nil {
                return err
            }
            
            connectionID := ctx.Request.RequestContext.ConnectionID
            
            switch msg.Type {
            case "subscribe":
                return handleSubscribe(ctx, connectionID, msg.Stream)
            case "unsubscribe":
                return handleUnsubscribe(ctx, connectionID, msg.Stream)
            case "ping":
                return sendMessage(connectionID, map[string]string{"type": "pong"})
            default:
                return sendError(connectionID, "unknown message type")
            }
        }
        
    broadcast_pattern:
      pattern: |
        func broadcastToStream(stream string, event interface{}) error {
            // 1. Get all subscriptions for stream
            subscriptions, err := repo.GetStreamSubscriptions(stream)
            if err != nil {
                return err
            }
            
            // 2. Send to each connection
            var wg sync.WaitGroup
            for _, sub := range subscriptions {
                wg.Add(1)
                go func(connectionID string) {
                    defer wg.Done()
                    
                    if err := sendMessage(connectionID, event); err != nil {
                        // Connection closed, clean up
                        repo.DeleteConnection(connectionID)
                    }
                }(sub.ConnectionID)
            }
            
            wg.Wait()
            return nil
        }

federation_api_patterns:
  
  activitypub_endpoints:
    pattern_name: "ActivityPub Implementation"
    
    inbox_handler:
      location: "cmd/inbox/handler.go"
      pattern: |
        func handleInbox(ctx *lift.Context) error {
            // 1. Verify HTTP signature
            signature := ctx.Request.Headers["Signature"]
            if err := verifyHTTPSignature(ctx.Request, signature); err != nil {
                return lift.NewLiftError("INVALID_SIGNATURE", "Signature verification failed", 401)
            }
            
            // 2. Parse activity
            var activity activitypub.Activity
            if err := json.Unmarshal(ctx.Request.Body, &activity); err != nil {
                return lift.NewLiftError("INVALID_ACTIVITY", "Invalid ActivityPub format", 400)
            }
            
            // 3. Validate actor
            actor, err := fetchActor(activity.Actor)
            if err != nil {
                return lift.NewLiftError("ACTOR_FETCH_FAILED", "Could not fetch actor", 400)
            }
            
            // 4. Check instance blocks
            if isBlocked(actor.Instance) {
                return lift.NewLiftError("INSTANCE_BLOCKED", "Instance is blocked", 403)
            }
            
            // 5. Store for processing
            if err := repo.SaveActivity(activity); err != nil {
                return err
            }
            
            // 6. Return accepted
            return ctx.JSON(202, map[string]string{"status": "accepted"})
        }
        
    outbox_handler:
      pattern: |
        func handleOutbox(ctx *lift.Context) error {
            username := ctx.Request.Params["username"]
            
            // Public outbox - return collection
            collection := &activitypub.OrderedCollection{
                Context:      activitypub.Context,
                Type:         "OrderedCollection",
                ID:           fmt.Sprintf("https://%s/users/%s/outbox", domain, username),
                TotalItems:   0,
                OrderedItems: []interface{}{},
            }
            
            // Add public activities if requested
            if ctx.Request.Query["page"] == "true" {
                activities, err := repo.GetPublicActivities(username, 20)
                if err != nil {
                    return err
                }
                collection.OrderedItems = activities
            }
            
            ctx.Response.Headers["Content-Type"] = "application/activity+json"
            return ctx.JSON(200, collection)
        }

  http_signatures:
    pattern_name: "HTTP Signature Implementation"
    
    signing_requests:
      pattern: |
        func signRequest(req *http.Request, keyID string, privateKey *rsa.PrivateKey) error {
            // 1. Create signature string
            date := time.Now().UTC().Format(http.TimeFormat)
            req.Header.Set("Date", date)
            req.Header.Set("Host", req.URL.Host)
            
            signatureString := fmt.Sprintf("(request-target): %s %s\nhost: %s\ndate: %s",
                strings.ToLower(req.Method), req.URL.Path, req.URL.Host, date)
                
            if req.Body != nil {
                bodyBytes, _ := io.ReadAll(req.Body)
                req.Body = io.NopCloser(bytes.NewReader(bodyBytes))
                
                digest := sha256.Sum256(bodyBytes)
                digestHeader := "SHA-256=" + base64.StdEncoding.EncodeToString(digest[:])
                req.Header.Set("Digest", digestHeader)
                signatureString += fmt.Sprintf("\ndigest: %s", digestHeader)
            }
            
            // 2. Sign with private key
            hash := sha256.Sum256([]byte(signatureString))
            signature, err := rsa.SignPKCS1v15(rand.Reader, privateKey, crypto.SHA256, hash[:])
            if err != nil {
                return err
            }
            
            // 3. Add signature header
            signatureHeader := fmt.Sprintf(`keyId="%s",headers="(request-target) host date%s",signature="%s",algorithm="rsa-sha256"`,
                keyID,
                ifBody(" digest"),
                base64.StdEncoding.EncodeToString(signature))
                
            req.Header.Set("Signature", signatureHeader)
            return nil
        }

rate_limiting_patterns:
  
  implementation:
    pattern_name: "Rate Limiting"
    
    middleware:
      pattern: |
        func RateLimitMiddleware(limiter *ratelimit.Limiter) lift.Middleware {
            return func(next lift.Handler) lift.Handler {
                return func(ctx *lift.Context) error {
                    // 1. Identify client
                    clientID := getClientID(ctx)
                    
                    // 2. Check rate limit
                    allowed, remaining, resetAt := limiter.Check(clientID, ctx.Request.Path)
                    
                    // 3. Set headers
                    ctx.Response.Headers["X-RateLimit-Limit"] = fmt.Sprint(limiter.Limit)
                    ctx.Response.Headers["X-RateLimit-Remaining"] = fmt.Sprint(remaining)
                    ctx.Response.Headers["X-RateLimit-Reset"] = fmt.Sprint(resetAt.Unix())
                    
                    // 4. Block if exceeded
                    if !allowed {
                        ctx.Response.Headers["Retry-After"] = fmt.Sprint(resetAt.Unix())
                        return lift.NewLiftError("RATE_LIMITED", "Too many requests", 429)
                    }
                    
                    return next(ctx)
                }
            }
        }
        
    configuration:
      endpoints: |
        var rateLimits = map[string]RateLimit{
            "POST /api/v1/statuses":     {Limit: 30, Window: time.Hour},
            "POST /api/v1/media":         {Limit: 10, Window: time.Hour},
            "GET /api/v1/timelines/*":    {Limit: 300, Window: 5 * time.Minute},
            "GET /api/v2/search":         {Limit: 60, Window: time.Minute},
            "default":                    {Limit: 300, Window: 5 * time.Minute},
        }

api_versioning:
  
  strategy:
    pattern_name: "API Version Management"
    
    url_versioning:
      v1: "/api/v1/*"
      v2: "/api/v2/*"
      
    header_versioning:
      header: "X-API-Version"
      default: "v1"
      
    implementation: |
      func VersionMiddleware() lift.Middleware {
          return func(next lift.Handler) lift.Handler {
              return func(ctx *lift.Context) error {
                  // Extract version from path or header
                  version := extractVersion(ctx.Request.Path)
                  if version == "" {
                      version = ctx.Request.Headers["X-API-Version"]
                  }
                  if version == "" {
                      version = "v1"
                  }
                  
                  // Store in context
                  ctx.Set("api_version", version)
                  
                  // Route to appropriate handler
                  return next(ctx)
              }
          }
      }
