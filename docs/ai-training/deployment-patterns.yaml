# Deployment Patterns for Lesser
# Version: 1.0.0
# Purpose: Train AI systems on Lesser deployment procedures

context:
  description: "Lesser deployment patterns using the `lesser` CLI (CDK under the hood) and Lift runtime conventions"
  prerequisites:
    - aws_cli_configured: true
    - cdk_version: ">=2.0.0"
    - go_version: ">=1.26"
    - architecture: "arm64 preferred for cost optimization"
  
  key_concepts:
    - infrastructure_as_code: "AWS CDK with TypeScript/Go"
    - serverless_first: "Lambda, DynamoDB, S3, CloudFront"
    - lift_framework: "Abstraction layer for Lambda patterns"
    - single_table_design: "DynamoDB with 8 GSIs"

deployment_patterns:
  
  initial_setup:
    pattern_name: "First Time Deployment"
    when_to_use: "Deploying a new Lesser instance (dev + live, optional staging)"
    steps:
      - action: "Confirm AWS identity"
        command: "AWS_PROFILE=<profile> aws sts get-caller-identity"
        validation: "Account + ARN are returned"
        
      - action: "Build operator CLI (required)"
        command: "go build -o lesser ./cmd/lesser"
        validation: "./lesser help"
        
      - action: "Deploy (creates dev + live; staging optional)"
        command: "./lesser up --app <app-slug> --base-domain <domain> --aws-profile <profile> --out <path>"
        note: "The CLI builds Lambda zips and runs CDK bootstrap automatically. Use --with-staging to deploy staging; --rebuild-lambdas forces a rebuild"
        duration: "10-25 minutes (cold deploys can take longer)"

  environment_specific_deployment:
    pattern_name: "Environment-Based Deployment"
    environments:
      dev_and_live:
        description: "Always deployed together for a new instance"
        domain_pattern:
          dev: "dev.<base-domain>"
          live: "<base-domain>"
        command: "./lesser up --app <app-slug> --base-domain <base-domain> --aws-profile <profile> --out <path>"
        outputs: "CLI prints instance URLs and writes print-once secrets to --out"
        
      staging_optional:
        description: "Optional staging stage for community testing"
        domain_pattern: "staging.<base-domain>"
        command: "./lesser up --with-staging --app <app-slug> --base-domain <base-domain> --aws-profile <profile> --out <path>"

  lambda_build_patterns:
    pattern_name: "Building Lambda Functions"
    
    build_all:
      command: "./lesser build lambdas"
      description: "Build all Lambda functions (repo contributor workflow; operators normally rely on `lesser up`)"
      parallel: true
      architecture: "GOOS=linux GOARCH=arm64"
      
    build_specific:
      command: "./lesser build lambda api"
      description: "Build a single Lambda zip artifact"
      
    build_with_tags:
      command: "go build -tags lambda.norpc -o bin/function"
      description: "Build with Lambda-specific tags"
      
    optimization_flags:
      - "-ldflags='-s -w'": "Strip debug symbols"
      - "-trimpath": "Remove file paths"
      - "CGO_ENABLED=0": "Disable CGO for pure Go binary"

  stack_management:
    pattern_name: "CDK Stack Operations"
    
    list_stacks:
      command: "cd infra/cdk && AWS_PROFILE=<profile> cdk list --context app=<app> --context baseDomain=<base-domain> --context hostedZoneId=<hosted-zone-id>"
      expected_output: |
        <app>-shared
        <app>-dev
        <app>-live
        # (optional) <app>-staging when withStaging=true
        
    diff_changes:
      command: "cd infra/cdk && AWS_PROFILE=<profile> cdk diff --all --context app=<app> --context baseDomain=<base-domain> --context hostedZoneId=<hosted-zone-id> --context stage=live"
      description: "Preview changes before deployment"
      when_to_use: "Before any production deployment"
      
    deploy_specific_stack:
      command: "cd infra/cdk && AWS_PROFILE=<profile> cdk deploy <app>-live --require-approval never --context app=<app> --context baseDomain=<base-domain> --context hostedZoneId=<hosted-zone-id> --context stage=live"
      description: "Deploy a single stage stack (example: live)"
      
    destroy_stack:
      command: "cd infra/cdk && AWS_PROFILE=<profile> cdk destroy <app>-dev --force --context app=<app> --context baseDomain=<base-domain> --context hostedZoneId=<hosted-zone-id> --context stage=dev"
      warning: "Deletes all resources including data"
      confirmation_required: true

  certificate_management:
    pattern_name: "SSL Certificate Setup"
    approach: "Stage stacks create wildcard certificates per stage and validate via Route53 in-account"
    wildcard_coverage:
      - "api.<stage-domain>"
      - "ws.<stage-domain>"
      - "<stage-domain> (client/apex when applicable)"
    requirements:
      - "Route53 hosted zone for <base-domain> must exist in the same AWS account"
      - "If hosted zone is not found, deployment must fail fast"

  domain_configuration:
    pattern_name: "Custom Domain Setup"
    
    cloudfront_distribution:
      automatic: true
      description: "CDK creates CloudFront distribution automatically"
      
    route53_setup:
      automatic: true
      description: "Stage stacks own required Route53 records for API/WS/Auth/Client domains"
        
    api_gateway_domain:
      automatic: true
      path_mapping: "/api/* -> API Gateway"

rollback_procedures:
  
  lambda_rollback:
    pattern_name: "Lambda Function Rollback"
    steps:
      - "Redeploy the previous git SHA/tag via the Lesser CLI"
      - "If CloudFormation is mid-update, cancel the stack update before retrying"
    command: "git checkout <tag> && ./lesser up --app <app> --base-domain <base-domain> --aws-profile <profile> --rebuild-lambdas"
    
  database_rollback:
    pattern_name: "DynamoDB Rollback"
    note: "Point-in-time recovery must be enabled"
    steps:
      - "Identify recovery timestamp"
      - "Restore table to new name"
      - "Swap table references"
      
  full_rollback:
    pattern_name: "Complete Environment Rollback"
    command: "aws cloudformation cancel-update-stack --stack-name <app>-live"
    alternative: "Deploy previous git tag"

validation_checks:
  
  post_deployment:
    health_check:
      endpoint: "https://<stage-domain>/health"
      expected_status: 200
      note: "A newly deployed instance may be reachable-but-locked until activation is completed"
      
    federation_check:
      endpoint: "https://domain.com/.well-known/webfinger?resource=acct:admin@domain.com"
      expected_status: 200
      content_type: "application/jrd+json"
      
    api_check:
      endpoint: "https://domain.com/api/v1/instance"
      expected_status: 200
      validates: "Mastodon API compatibility"
      
    graphql_check:
      endpoint: "https://domain.com/graphql"
      method: "POST"
      body: '{"query":"{ instance { title version } }"}'
      expected_fields: ["title", "version"]

common_issues:
  
  build_failures:
    symptom: "Lambda build fails"
    causes:
      - "Wrong Go version"
      - "Missing dependencies"
      - "Incorrect architecture"
    solutions:
      - "Ensure Go 1.25+"
      - "Run 'go mod download'"
      - "Set GOOS=linux GOARCH=arm64"
      
  deployment_failures:
    symptom: "CDK deployment fails"
    causes:
      - "AWS credentials not configured"
      - "CDK not bootstrapped"
      - "IAM permissions insufficient"
    solutions:
      - "Run 'aws configure'"
      - "Run 'cdk bootstrap'"
      - "Check IAM policy has CDK permissions"
      
  certificate_issues:
    symptom: "Certificate validation fails"
    causes:
      - "DNS records not added"
      - "Wrong region (must be us-east-1)"
      - "Domain not owned"
    solutions:
      - "Add CNAME records from ACM"
      - "Request certificate in us-east-1"
      - "Verify domain ownership"

best_practices:
  
  deployment_strategy:
    - use_environments: "Always deploy to dev/staging before production"
    - automate_builds: "Use CI/CD for consistent builds"
    - tag_releases: "Tag git commits for production deployments"
    - monitor_costs: "Set up budget alerts before deployment"
    
  security:
    - rotate_secrets: "Rotate JWT secret quarterly"
    - enable_waf: "Enable AWS WAF for production"
    - use_parameter_store: "Store secrets in AWS Parameter Store"
    - enable_deletion_protection: "Protect production resources"
    
  performance:
    - use_arm64: "20% better price/performance than x86"
    - enable_provisioned_concurrency: "For consistent latency"
    - optimize_memory: "Right-size Lambda memory allocations"
    - enable_caching: "Use CloudFront for static content"

automation_examples:
  
  github_actions:
    description: "CI/CD pipeline for automated deployment"
    workflow: |
      name: Deploy Lesser
      on:
        push:
          branches: [main]
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-go@v4
              with:
                go-version: '1.25'
            - name: Build Lesser CLI
              run: go build -o lesser ./cmd/lesser
            - name: Build Lambdas
              run: ./lesser build lambdas
            - name: Deploy CDK
              run: |
                cd infra/cdk
                npm install
                npx cdk deploy --all --require-approval never
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                
  terraform_migration:
    note: "For teams preferring Terraform"
    approach: "Use 'cdk synth' to generate CloudFormation, then import"
