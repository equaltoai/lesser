# Troubleshooting Patterns for Lesser
# Version: 1.0.0
# Purpose: Train AI on diagnosing and resolving common issues

context:
  description: "Troubleshooting patterns and problem resolution for Lesser"
  approach:
    - symptom_based: "Start with observable symptoms"
    - systematic_diagnosis: "Follow structured investigation"
    - root_cause_analysis: "Identify underlying issues"
    - verified_resolution: "Confirm fix effectiveness"

common_issues:
  
  deployment_failures:
    
    cdk_bootstrap_error:
      symptom: "CDK deployment fails with 'Stack CDKToolkit not found'"
      cause: "CDK not bootstrapped in account/region"
      diagnosis:
        - command: "aws cloudformation describe-stacks --stack-name CDKToolkit"
          expected: "Stack not found error"
      resolution:
        - action: "Bootstrap CDK"
          command: "cdk bootstrap aws://ACCOUNT-ID/REGION"
        - action: "Verify bootstrap"
          command: "aws cloudformation describe-stacks --stack-name CDKToolkit"
          
    lambda_build_failure:
      symptom: "Lambda function fails to build"
      common_causes:
        - "Wrong Go version"
        - "Missing dependencies"
        - "Incorrect architecture flags"
      diagnosis:
        - command: "go version"
          expected: "go1.24 or higher"
        - command: "go mod tidy"
          expected: "No errors"
      resolution:
        - action: "Set correct build flags"
          command: "GOOS=linux GOARCH=arm64 go build"
        - action: "Clear build cache"
          command: "go clean -cache"
          
    certificate_validation_failure:
      symptom: "ACM certificate stuck in 'Pending Validation'"
      cause: "DNS records not added or incorrect"
      diagnosis:
        - command: "aws acm describe-certificate --certificate-arn ARN"
          check: "DomainValidationOptions for CNAME records"
        - command: "nslookup CNAME_RECORD"
          expected: "Should resolve"
      resolution:
        - action: "Add CNAME records to DNS"
        - action: "Wait 5-30 minutes for validation"
        - action: "If using Route53"
          command: "aws acm wait certificate-validated --certificate-arn ARN"

  runtime_errors:
    
    lambda_timeout:
      symptom: "Lambda function timing out"
      indicators:
        - "Task timed out after X seconds"
        - "Duration equals configured timeout"
      diagnosis:
        - check: "CloudWatch Logs for operation duration"
        - check: "X-Ray traces for bottlenecks"
        - check: "Memory utilization"
      resolution:
        short_term:
          - action: "Increase timeout"
            location: "infra/cdk/inventory/lambdas.go"
            setting: "defaults.TimeoutSeconds or per-lambda Overrides.TimeoutSeconds"
        long_term:
          - "Optimize database queries"
          - "Implement pagination"
          - "Add caching layer"
          - "Split into smaller operations"
          
    dynamodb_throttling:
      symptom: "ProvisionedThroughputExceededException"
      indicators:
        - "ThrottledRequests metric increasing"
        - "HTTP 400 errors from DynamoDB"
      diagnosis:
        - command: |
            aws cloudwatch get-metric-statistics \
              --namespace AWS/DynamoDB \
              --metric-name ThrottledRequests \
              --dimensions Name=TableName,Value=<app>-<stage>-main-table \
              --start-time 2024-01-01T00:00:00Z \
              --end-time 2024-01-01T01:00:00Z \
              --period 300 \
              --statistics Sum
      resolution:
        immediate:
          - action: "Switch to on-demand billing"
            command: |
              aws dynamodb update-table \
                --table-name <app>-<stage>-main-table \
                --billing-mode PAY_PER_REQUEST
        optimized:
          - "Implement exponential backoff"
          - "Use batch operations"
          - "Add caching layer"
          
    memory_exhaustion:
      symptom: "Runtime exited with error: signal: killed"
      indicators:
        - "Memory utilization at 100%"
        - "Function crashes without error message"
      diagnosis:
        - check: "Lambda Insights memory metrics"
        - check: "CloudWatch Logs for memory usage"
      resolution:
        - action: "Increase memory allocation"
          location: "infra/cdk/constructs/lambda_functions.go"
          change: "MemorySize: jsii.Number(1024)"
        - action: "Optimize memory usage"
          techniques:
            - "Stream large files instead of loading"
            - "Clear unused variables"
            - "Use pagination for queries"

  federation_issues:
    
    signature_verification_failure:
      symptom: "HTTP signature verification failed"
      common_causes:
        - "Clock skew between servers"
        - "Incorrect public key"
        - "Malformed signature header"
      diagnosis:
        - check: "Inbox Lambda logs for signature details"
        - check: "Actor fetch results"
        - command: "curl -H 'Accept: application/activity+json' ACTOR_URL"
      resolution:
        - action: "Verify server time"
          command: "date && curl -I REMOTE_SERVER | grep -i date"
        - action: "Clear actor cache"
        - action: "Re-fetch actor public key"
          
    delivery_failures:
      symptom: "Activities not reaching remote servers"
      indicators:
        - "Messages accumulating in federation-queue"
        - "High DLQ message count"
      diagnosis:
        - check: "federation-delivery Lambda logs"
        - check: "DLQ message attributes"
        - test: "Manual delivery attempt"
          command: |
            curl -X POST REMOTE_INBOX \
              -H "Content-Type: application/activity+json" \
              -d '{"type":"Test"}'
      resolution:
        - action: "Check remote server status"
        - action: "Verify instance not blocked"
        - action: "Process DLQ messages"
          command: |
            aws lambda invoke \
              --function-name <app>-<stage>-dlq-processor \
              --payload '{"action":"retry"}' \
              response.json
              
    webfinger_not_working:
      symptom: "User discovery failing"
      test: "curl https://domain.com/.well-known/webfinger?resource=acct:user@domain.com"
      diagnosis:
        - check: "API Gateway route configuration"
        - check: "Webfinger Lambda logs"
        - check: "User exists in database"
      resolution:
        - action: "Verify route mapping"
        - action: "Check content-type header"
          required: "application/jrd+json"

  api_problems:
    
    unauthorized_errors:
      symptom: "401 Unauthorized responses"
      common_causes:
        - "JWT expired"
        - "Invalid JWT secret"
        - "Missing Authorization header"
      diagnosis:
        - check: "JWT expiration time"
          decode: "jwt.io or jwt decode tool"
        - check: "JWT secret matches"
        - check: "Authorization header format"
          correct: "Bearer TOKEN"
      resolution:
        - action: "Regenerate token"
        - action: "Verify JWT secret in environment"
        - action: "Check CORS configuration"
          
    cors_errors:
      symptom: "CORS policy blocking requests"
      browser_error: "Access-Control-Allow-Origin missing"
      diagnosis:
        - check: "API Gateway CORS configuration"
        - check: "Response headers"
          command: "curl -I -X OPTIONS API_ENDPOINT"
      resolution:
        - action: "Update CORS configuration"
          location: "infra/cdk/constructs/api_gateway.go"
          settings: |
            cors: {
              allowOrigins: ['*'],
              allowMethods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS'],
              allowHeaders: ['Content-Type', 'Authorization']
            }
            
    rate_limiting:
      symptom: "429 Too Many Requests"
      indicators:
        - "X-RateLimit-Remaining: 0"
        - "Retry-After header present"
      diagnosis:
        - check: "Rate limit configuration"
        - check: "Client request patterns"
      resolution:
        - action: "Implement client-side throttling"
        - action: "Increase rate limits if legitimate"
        - action: "Add caching to reduce requests"

  websocket_issues:
    
    connection_drops:
      symptom: "WebSocket connections closing unexpectedly"
      common_causes:
        - "Idle timeout (10 minutes default)"
        - "Lambda timeout"
        - "Client network issues"
      diagnosis:
        - check: "Connection duration in logs"
        - check: "Error messages at disconnect"
        - check: "API Gateway connection limits"
      resolution:
        - action: "Implement heartbeat/ping"
          interval: "30 seconds"
        - action: "Increase Lambda timeout"
        - action: "Handle reconnection client-side"
          
    messages_not_delivered:
      symptom: "Real-time updates not reaching clients"
      diagnosis:
        - check: "WebSocket connection status"
        - check: "Subscription records in DynamoDB"
        - check: "stream-router Lambda logs"
      resolution:
        - action: "Verify connection ID is valid"
        - action: "Check subscription filters"
        - action: "Test manual message send"
          command: |
            aws apigatewaymanagementapi post-to-connection \
              --connection-id CONNECTION_ID \
              --data '{"test":"message"}'

  database_issues:
    
    query_performance:
      symptom: "Slow query response times"
      indicators:
        - "High DynamoDB latency"
        - "Lambda duration increasing"
      diagnosis:
        - check: "Query patterns and filters"
        - check: "GSI usage"
        - check: "Item size and pagination"
      resolution:
        - action: "Use appropriate GSI"
        - action: "Implement pagination"
          limit: 25
        - action: "Add projection expressions"
        - action: "Consider DynamoDB DAX"
          
    data_inconsistency:
      symptom: "Data not appearing or incorrect"
      common_causes:
        - "Eventual consistency issues"
        - "Race conditions"
        - "Failed stream processing"
      diagnosis:
        - check: "DynamoDB Stream errors"
        - check: "Write conditions"
        - check: "Transaction usage"
      resolution:
        - action: "Use consistent reads for critical data"
        - action: "Implement optimistic locking"
        - action: "Add transaction support"

  cost_issues:
    
    unexpected_charges:
      symptom: "AWS bill higher than expected"
      diagnosis:
        - tool: "AWS Cost Explorer"
          groupBy: "Service"
        - check: "CloudWatch custom metrics for cost"
        - check: "Lambda invocation counts"
      common_causes:
        - "Infinite retry loops"
        - "Large media not compressed"
        - "Excessive logging"
        - "Unused resources"
      resolution:
        - action: "Identify top cost drivers"
        - action: "Implement cost controls"
        - action: "Clean up unused resources"
          command: "cdk destroy unused-stack"
          
    budget_exceeded:
      symptom: "Budget alert triggered"
      immediate_actions:
        - "Disable AI features"
        - "Reduce Lambda memory"
        - "Enable aggressive caching"
        - "Throttle expensive operations"
      investigation:
        - check: "Cost allocation tags"
        - check: "Per-operation costs"
        - check: "User activity patterns"
      long_term_solutions:
        - "Optimize Lambda memory settings"
        - "Implement request coalescing"
        - "Use S3 lifecycle policies"
        - "Enable CloudFront caching"

diagnostic_tools:
  
  log_analysis:
    cloudwatch_insights: |
      # Find errors by type
      fields @timestamp, error, count
      | filter level = "ERROR"
      | stats count() by error
      | sort count desc
      
      # Trace request flow
      fields @timestamp, @message
      | filter requestId = "REQUEST_ID"
      | sort @timestamp
      
      # Find slow operations
      fields operation, duration
      | filter duration > 1000
      | stats avg(duration), max(duration), count() by operation
      
  performance_analysis:
    xray_queries: |
      # Find slow traces
      service("<app>-<stage>-api") AND duration > 2
      
      # Find error traces
      service("<app>-<stage>-api") AND error = true
      
      # Find specific operation
      annotation.operation = "CreateStatus"
      
  cost_analysis:
    commands: |
      # Get Lambda costs
      aws ce get-cost-and-usage \
        --time-period Start=2024-01-01,End=2024-01-31 \
        --granularity DAILY \
        --metrics UnblendedCost \
        --group-by Type=DIMENSION,Key=SERVICE \
        --filter file://lambda-filter.json

recovery_procedures:
  
  data_recovery:
    from_backup: |
      # Enable point-in-time recovery first
      aws dynamodb restore-table-to-point-in-time \
        --source-table-name <app>-<stage>-main-table \
        --target-table-name <app>-<stage>-main-table-restored \
        --restore-date-time 2024-01-01T12:00:00Z
        
  service_recovery:
    rollback_deployment: |
      # Recommended: redeploy via the Lesser CLI (shared + stages)
      ./lesser up --app <app> --base-domain <base-domain> --aws-profile <profile> --rebuild-lambdas
      
  emergency_procedures:
    disable_ai: |
      # Disable AI features (requires updating Lambda env + redeploy)
      DISABLE_AI=true
      
    disable_metrics: |
      # Disable metrics (requires updating Lambda env + redeploy)
      DISABLE_METRICS=true
