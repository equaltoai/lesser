              TableName: aws.String("lesser-main"),
              FilterExpression: aws.String("begins_with(PK, :prefix)"),
          })
          
          for paginator.HasMorePages() {
              page, err := paginator.NextPage(ctx)
              // Process items
              // Write transformed data
          }
      }

  schema_evolution:
    pattern_name: "Evolve Schema"
    
    backwards_compatible:
      - "Add optional fields"
      - "Create new GSI"
      - "Add new access patterns"
      
    breaking_changes:
      - "Use versioned entities"
      - "Maintain compatibility layer"
      - "Gradual migration"

performance_optimization_patterns:
  
  caching:
    pattern_name: "Add Caching Layer"
    
    locations:
      - "CloudFront for static content"
      - "DynamoDB DAX for hot data"
      - "Lambda memory for warm starts"
      
    implementation: |
      type CachedService struct {
          service Service
          cache   *cache.Cache
      }
      
      func (c *CachedService) Get(id string) (*Entity, error) {
          if cached, ok := c.cache.Get(id); ok {
              return cached.(*Entity), nil
          }
          
          entity, err := c.service.Get(id)
          if err == nil {
              c.cache.Set(id, entity, 5*time.Minute)
          }
          return entity, err
      }

  batch_processing:
    pattern_name: "Batch Operations"
    
    use_cases:
      - "Bulk imports"
      - "Timeline updates"
      - "Notification delivery"
      
    implementation: |
      func processBatch(items []Item) error {
          // Group items by operation
          batches := groupIntoBatches(items, 25)
          
          for _, batch := range batches {
              writeRequests := make([]types.WriteRequest, 0, len(batch))
              for _, item := range batch {
                  writeRequests = append(writeRequests, types.WriteRequest{
                      PutRequest: &types.PutRequest{Item: item},
                  })
              }
              
              _, err := client.BatchWriteItem(ctx, &dynamodb.BatchWriteItemInput{
                  RequestItems: map[string][]types.WriteRequest{
                      "lesser-main": writeRequests,
                  },
              })
          }
      }

monitoring_additions:
  
  custom_metrics:
    pattern_name: "Add Custom Metrics"
    
    location: "pkg/observability/metrics.go"
    example: |
      func EmitFeatureMetric(ctx context.Context, metricName string, value float64) {
          emf.Emit(emf.Metric{
              Namespace: "Lesser/Features",
              Name:      metricName,
              Value:     value,
              Unit:      emf.Count,
              Dimensions: map[string]string{
                  "Feature": "NewFeature",
                  "Environment": os.Getenv("ENVIRONMENT"),
              },
          })
      }
      
  alarms:
    pattern_name: "Add CloudWatch Alarms"
    
    location: "infra/cdk/constructs/monitoring.go"
    example: |
      NewFeatureErrorAlarm: cloudwatch.NewAlarm(stack, jsii.String("NewFeatureErrors"), &cloudwatch.AlarmProps{
          Metric: NewFeatureFunction.MetricErrors(),
          Threshold: jsii.Number(10),
          EvaluationPeriods: jsii.Number(2),
      })
