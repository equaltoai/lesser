version: 2
exemptions:
    - id: oauth_oidc
      reason: OAuth/OIDC flows are REST-only (authorize/token/discovery/redirects/client registration).
      match:
        exact:
            - /api/v1/apps
        prefixes:
            - /oauth
    - id: auth_setup
      reason: Wallet auth, WebAuthn, and setup bootstrap flows are REST-only.
      match:
        prefixes:
            - /auth/wallet
            - /api/v1/auth/webauthn
            - /setup
    - id: protocol_infra
      reason: Protocol and infrastructure endpoints are REST-only by design.
      match:
        exact:
            - /robots.txt
        prefixes:
            - /.well-known
            - /nodeinfo
            - /users/
            - /health
    - id: ui_routing
      reason: UI routing/redirect endpoints are not GraphQL capabilities.
      match:
        exact:
            - /
    - id: embeds
      reason: oEmbed and embed HTML pages are REST-only.
      match:
        exact:
            - /api/oembed
        prefixes:
            - /embed
    - id: agents
      reason: Some agent auth/registration/key-rotation endpoints are REST-only for now.
      match:
        exact:
            - /api/v1/agents/auth/challenge
            - /api/v1/agents/auth/token
            - /api/v1/agents/memory/search
            - /api/v1/agents/register
            - /api/v1/agents/register/challenge
            - /api/v1/agents/{username}/rotate-key
            - /api/v1/agents/{username}/rotate-key/challenge
    - id: lesser_host_trust
      reason: Managed-instance lesser-host trust proxy endpoints are REST-only for now.
      match:
        prefixes:
            - /api/v1/trust
