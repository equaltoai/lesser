version: 2
exemptions:
    - id: oauth_oidc
      reason: OAuth/OIDC flows are REST-only (authorize/token/discovery/redirects/client registration).
      match:
        exact:
            - /api/v1/apps
        prefixes:
            - /oauth
    - id: auth_setup
      reason: Wallet auth, WebAuthn, and setup bootstrap flows are REST-only.
      match:
        prefixes:
            - /auth/wallet
            - /api/v1/auth/webauthn
            - /setup
    - id: protocol_infra
      reason: Protocol and infrastructure endpoints are REST-only by design.
      match:
        prefixes:
            - /.well-known
            - /nodeinfo
            - /users/
            - /health
    - id: ui_routing
      reason: UI routing/redirect endpoints are not GraphQL capabilities.
      match:
        exact:
            - /
    - id: embeds
      reason: oEmbed and embed HTML pages are REST-only.
      match:
        exact:
            - /api/oembed
        prefixes:
            - /embed
routes:
    - method: GET
      path: /
      policy: rest_only
      exemptedBy: ui_routing
    - method: GET
      path: /.well-known/nodeinfo
      policy: rest_only
      exemptedBy: protocol_infra
    - method: GET
      path: /.well-known/reputation-keys
      policy: rest_only
      exemptedBy: protocol_infra
    - method: GET
      path: /api/oembed
      policy: rest_only
      exemptedBy: embeds
