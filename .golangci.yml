# golangci-lint configuration for Lesser project
# Configuration version
version: "2"

run:
  # Timeout for analysis
  timeout: 5m
  
  # Include test files
  tests: true
  
  # List of build tags to apply
  build-tags:
    - integration
  
  # Which directories to exclude
  exclude-dirs:
    - docs
    - scripts
    - examples
    - infra
    - tests
    - build
    - bin
    - dist
    - paytheory-partnership
    - internal/testutil/mocks

output:
  # Output format
  format: colored-line-number
  
  # Print lines of code with issue
  print-issued-lines: true
  
  # Print linter name in the end of issue text
  print-linter-name: true

linters:
  enable:
    # Critical - Security and correctness
    - govet         # Reports suspicious constructs
    - staticcheck   # Advanced static analysis
    - gosec         # Security problems
    - bodyclose     # Checks HTTP response body closure
    - noctx         # HTTP without context
    - bidichk       # Dangerous unicode
    
    # Code quality - Important for maintainability
    - ineffassign   # Detects unused assignments
    - unused        # Checks for unused code
    - errcheck      # Checking for unchecked errors
    - misspell      # Spelling mistakes
    - unconvert     # Unnecessary type conversions
    - unparam       # Unused function parameters
    
    # Style - Keep codebase consistent
    - revive        # Style and conventions
    - goconst       # Finds repeated strings (configured)
    - nakedret      # Finds naked returns in long functions
    
    # Performance
    - prealloc      # Preallocatable slices (for hot paths only)
    
    # Complexity management
    - gocyclo       # Cyclomatic complexity (configured)
    - dupl          # Code duplication (configured)
    
  disable:
    # Legitimately too strict
    - exhaustive    # Not all switches need to be exhaustive
    - nilerr        # Returning nil, nil is often correct
    - copyloopvar   # Not always necessary
    - whitespace    # Too pedantic about blank lines
    
    # Already disabled
    - funlen        # Function length
    - godox         # TODO/FIXME comments
    - lll           # Line length
    - nestif        # Deeply nested ifs
    - wsl           # Whitespace linter
    - testpackage   # Separate test packages
    - paralleltest  # Parallel tests
    - wrapcheck     # Error wrapping
    - varnamelen    # Variable name length
    - gochecknoglobals # Global variables
    - gochecknoinits   # Init functions
    - cyclop        # Cyclomatic complexity
    - gocognit      # Cognitive complexity
    - maintidx      # Maintainability index
    - asciicheck    # Non-ASCII identifiers are fine

linters-settings:
  dupl:
    # Tokens count to trigger issue - increased for repository pattern code
    threshold: 200  # Repository methods often have similar structure
    
  errcheck:
    # Report about not checking of errors in type assertions
    check-type-assertions: false
    # Report about assignment of errors to blank identifier
    check-blank: false
    # Exclude some functions where error checking is often not needed
    exclude-functions:
      - io.Closer.Close
      - io/ioutil.ReadFile
      - io.Copy
      - io.WriteString
      - (net/http.ResponseWriter).Write
      - (io.Writer).Write
      - fmt.Print
      - fmt.Printf
      - fmt.Println
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - (*go.uber.org/zap.Logger).Debug
      - (*go.uber.org/zap.Logger).Info
      - (*go.uber.org/zap.Logger).Warn
      - (*go.uber.org/zap.Logger).Error
    
  goconst:
    # Minimal length of string constant
    min-len: 4  # Ignore very short strings
    # Minimal occurrences count to trigger
    min-occurrences: 5  # Only flag if used 5+ times
    
  gocyclo:
    # Minimal cyclomatic complexity to trigger
    min-complexity: 20  # Allow moderately complex functions
    
  gosec:
    # Exclude specific rules
    excludes:
      - G101 # Look for hardcoded credentials
      - G401 # Detect weak crypto (MD5, SHA1)
      - G501 # Import blocklist: crypto/md5
      - G505 # Import blocklist: crypto/sha1
    
  govet:
    # Settings for govet
    enable:
      - shadow
    settings:
      shadow:
        strict: false
    
  misspell:
    # Locale to use
    locale: US
    
  nakedret:
    # Max function length to check for naked returns
    max-func-lines: 50  # Only flag naked returns in longer functions
    
  prealloc:
    # Report preallocations only on simple loops
    simple: true
    range-loops: true
    for-loops: true
    
  revive:
    # Only enable essential rules
    rules:
      # Critical rules
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: var-naming
        arguments:
          - ["ID", "URL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "JSON", "LHS", "QPS", "RAM", "RHS", "RPC", "SLA", "SMTP", "SQL", "SSH", "TLS", "TTL", "UI", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XSRF", "XSS"]
      - name: time-naming
      - name: unexported-return
        disabled: true  # Interface implementations return unexported types
      - name: exported
        disabled: true  # We don't need comments on everything
      - name: if-return
        disabled: true  # Sometimes explicit is clearer
      - name: cognitive-complexity
        disabled: true
      - name: cyclomatic
        disabled: true  # Using gocyclo instead
      
  staticcheck:
    # Go version to target
    go: "1.21"
    
  unused:
    # Go version to target
    go: "1.21"
    
  unparam:
    # Don't report unused params in tests or when implementing interfaces
    check-exported: false
    
    
  whitespace:
    # Enforce proper whitespace
    multi-if: true
    multi-func: true

issues:
  # List of regexps of issue texts to exclude
  exclude:
    # Common patterns that are acceptable
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
    - "exported (type|method|function) .* should have comment or be unexported"
    - "ST1000: at least one file in a package should have a package comment"
    - "SA1019: .*is deprecated"  # We'll handle deprecations separately
    - "G104: Errors unhandled"  # Too many false positives
    - "at least one file in a package should have a package comment"
    - "should have a package comment"
    - "comment on exported"
    - "should have comment"
    - "Error return value not checked"
    - "error returned from interface method should be wrapped"
    - "cyclomatic complexity"
    
  # Exclude configuration per-path, per-linter, per-text
  exclude-rules:
    # Test files can be more relaxed
    - path: _test\.go
      linters:
        - gocyclo       # Tests can be complex
        - errcheck      # Tests often ignore errors intentionally
        - dupl          # Test patterns repeat
        - gosec         # Test security is less critical
        - goconst       # Test strings don't need constants
        - unparam       # Test helpers may have unused params
        
    # Exclude linters from generated files
    - path: generated\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - unused
        - goconst
        - revive
        
    # Lambda handlers often need init()
    - path: cmd/.*/main\.go
      linters:
        - gochecknoinits
      text: "init function"
        
    # GraphQL generated code
    - path: graph/generated\.go
      linters:
        - gocyclo
        - dupl
        - revive
        - goconst
        - gosec
        - errcheck
        
    # Model files often have repetitive code
    - path: (models?|model)/.*\.go
      linters:
        - dupl
        
    # Storage implementations often have similar patterns
    - path: pkg/storage/.*\.go
      linters:
        - dupl
        
    # Repository implementations have legitimate patterns
    - path: pkg/storage/repositories/.*\.go
      linters:
        - dupl          # Repository methods follow similar patterns
      text: "duplicate of"  # Only for actual duplication
        
    # Test utilities can be more relaxed
    - path: internal/testutil/.*\.go
      linters:
        - gosec
        - errcheck
        
    # DynamoDB operations have complex error handling
    - path: pkg/storage/dynamodb/.*\.go
      text: "shadow: declaration of .* shadows declaration"
      linters:
        - govet
        
    # Common AWS SDK patterns
    - text: "G104: Errors unhandled"
      path: ".*aws.*"
      linters:
        - gosec
        
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  
  # Maximum count of issues with the same text
  max-same-issues: 0
  
  # Show only new issues created after git revision
  # new-from-rev: main
  
  # Fix found issues (if it's supported by the linter)
  fix: false