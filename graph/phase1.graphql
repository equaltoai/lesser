# Phase 1: CMS GraphQL surface (headless publishing)

enum ContentFormat {
  HTML
  MARKDOWN
}

enum DraftStatus {
  DRAFT
  SCHEDULED
  PUBLISHING
  PUBLISHED
  FAILED
}

enum ChangeType {
  CREATE
  UPDATE
  RESTORE
}

enum PublicationRole {
  OWNER
  EDITOR
  WRITER
  CONTRIBUTOR
}

type TOCEntry {
  id: String!
  level: Int!
  text: String!
}

type Article {
  id: ID!
  deletedAt: Time
  slug: String!
  authorId: ID!
  author: Actor!

  title: String!
  subtitle: String
  excerpt: String

  content: String!
  contentFormat: ContentFormat!
  """Canonical sanitized HTML. Never fall back to rendering content when this field is unavailable."""
  renderedHtml: String

  featuredImage: Media
  tableOfContents: [TOCEntry!]!

  readingTimeMinutes: Int!
  wordCount: Int!

  series: Series
  seriesOrder: Int
  categories: [Category!]!

  seoTitle: String
  seoDescription: String
  canonicalUrl: String
  ogImage: String

  editorNotes: String
  reviewStatus: String

  generatedBy: Actor
  reviewedBy: Actor
  publishedBy: Actor
  """Caller attribution: the actor who performed the write on the author's behalf under an active share grant. Private CMS workflow attribution (author/admin viewers only)."""
  actedBy: Actor

  publishedAt: Time!
  createdAt: Time!
  updatedAt: Time!
}

type ArticleEdge {
  node: Article!
  cursor: Cursor!
}

type ArticleConnection {
  edges: [ArticleEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Draft {
  id: ID!
  authorId: ID!
  author: Actor!

  contentType: ObjectType!
  title: String
  slug: String
  content: String!
  contentFormat: ContentFormat!

  status: DraftStatus!
  scheduledAt: Time
  objectId: ID

  generatedBy: Actor
  reviewedBy: Actor
  """Caller attribution: the actor who performed the write on the author's behalf under an active share grant."""
  actedBy: Actor
  """Latest review verdict for the current draft content, or null when it has not been reviewed."""
  reviewVerdict: DraftReviewVerdict

  """Modeled editorial assets associated with this unpublished draft."""
  editorialMedia: [EditorialMediaUsage!]!

  """Canonical digest used to bind review verdicts to this exact draft content."""
  contentHash: String!
  """Monotonic draft revision; increments for updates and autosaves."""
  revision: Int!

  autosaveVersion: Int!
  lastSavedAt: Time!

  createdAt: Time!
  updatedAt: Time!
}

type DraftEdge {
  node: Draft!
  cursor: Cursor!
}

type DraftConnection {
  edges: [DraftEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

enum DraftReviewVerdict {
  APPROVED
  CHANGES_REQUESTED
}

type DraftReviewGrant {
  reviewerId: ID!
  reviewer: Actor!
  grantedAt: Time!
  """Bounded expiry; expired grants authorize no reads, URL minting, or approval."""
  expiresAt: Time
  status: DraftReviewGrantStatus!
  revokedAt: Time
}

enum DraftReviewGrantStatus {
  ACTIVE
  REVOKED
  EXPIRED
}

type DraftReviewVerdictRecord {
  verdict: DraftReviewVerdict!
  notes: String
  contentHash: String
  reviewerId: ID!
  reviewer: Actor!
  recordedAt: Time!
  """True only when this verdict is valid for the current draft revision and active grant."""
  current: Boolean!
  stale: Boolean!
}

type DraftPublishEligibility {
  eligible: Boolean!
  blockingReasons: [String!]!
  reviewersApproved: Boolean!
  principalApprovalRequired: Boolean!
  principalApproved: Boolean!
}

type DraftReview {
  draftId: ID!
  ownerId: ID!
  title: String
  slug: String
  content: String!
  """Canonical sanitized preview for the exact source and contentHash in this response."""
  renderedHtml: String
  renderErrors: [String!]!
  subtitle: String
  excerpt: String
  contentFormat: ContentFormat!
  status: DraftStatus!
  scheduledAt: Time
  updatedAt: Time!
  createdAt: Time!
  generatedBy: Actor
  reviewedBy: Actor
  reviewStatus: String
  editorNotes: String
  contentHash: String!
  """Exact draft-bound media visible to this owner or active reviewer."""
  editorialMedia: [EditorialMediaUsage!]!
  revision: Int!
  activeReviewerIds: [ID!]!
  publishEligible: Boolean!
  publishBlockingReasons: [String!]!
  reviewersApproved: Boolean!
  principalApprovalRequired: Boolean!
  principalApproved: Boolean!
  grantCount: Int!
  grantsTruncated: Boolean!
  grants: [DraftReviewGrant!]!
  """Caller-specific grant retained for backwards compatibility."""
  grant: DraftReviewGrant
  verdicts: [DraftReviewVerdictRecord!]!
  publishEligibility: DraftPublishEligibility!
}

type DraftReviewEdge { node: DraftReview!, cursor: Cursor! }
type DraftReviewConnection { edges: [DraftReviewEdge!]!, pageInfo: PageInfo!, totalCount: Int! }

type DraftPreview {
  draftId: ID!
  success: Boolean!
  renderedHtml: String
  sourceFormat: String!
  sourceBytes: Int!
  renderedBytes: Int!
  errors: [String!]!
  """Canonical structured media preview, including missing/processing/rejected placeholders."""
  editorialMedia: [EditorialMediaUsage!]!
}

enum EditorialMediaRole {
  HERO
  INLINE
  SOCIAL_CARD
}

enum EditorialMediaOrigin {
  AI_GENERATED
  AI_EDITED
  PHOTOGRAPHED
  ILLUSTRATED
  SUPPLIED
}

enum EditorialMediaState {
  MISSING
  PROCESSING
  READY
  REJECTED
  """Editorial lifecycle withdrew the asset; publication stays blocked until re-review."""
  WITHDRAWN
  """A named successor asset replaced this binding; publication stays blocked until re-review."""
  SUPERSEDED
  """The asset's bytes are not servable; publication stays blocked until re-review."""
  UNAVAILABLE
}

"""Explicit editorial lifecycle of an internal asset, distinct from the processing-pipeline status."""
enum EditorialMediaLifecycle {
  AVAILABLE
  WITHDRAWN
  SUPERSEDED
  UNAVAILABLE
}

type EditorialMediaLifecyclePayload {
  mediaId: ID!
  lifecycle: EditorialMediaLifecycle!
  supersededByMediaId: ID
}

type EditorialMediaProvenance {
  origin: EditorialMediaOrigin!
  tool: String
  responsibleActorId: ID!
  responsibleActor: Actor
  sourceReferences: [String!]!
  rightsLicenseNotes: String
  createdAt: Time
  updatedAt: Time
  recordedAt: Time!
  contentIntegrity: String!
}

type EditorialMediaUsage {
  mediaId: ID!
  role: EditorialMediaRole!
  """Zero-based insertion point for INLINE media; null for other roles."""
  inlinePosition: Int
  caption: String
  """Reader-facing attribution, distinct from internal provenance."""
  creditLine: String
  """Per-usage override; effectiveAltText falls back to the media-global description."""
  altText: String
  effectiveAltText: String
  focus: String
  state: EditorialMediaState!
  width: Int
  height: Int
  mimeType: String
  contentHash: String
  """Durable published serving minted at the publish transition; absent pre-publish."""
  publishedUrl: String
  publishedAt: Time
  """Short-lived exact-asset URL, only issued to an owner or active reviewer."""
  accessUrl: String
  accessExpiresAt: Time
  provenance: EditorialMediaProvenance
}

type EditorialMediaAccess {
  mediaId: ID!
  url: String!
  expiresAt: Time!
  contentHash: String!
}

type Revision {
  id: ID!
  objectId: ID!
  version: Int!
  content: String!
  metadataJson: String
  changedBy: Actor!
  changeSummary: String
  changeType: ChangeType!
  generatedBy: Actor
  reviewedBy: Actor
  publishedBy: Actor
  createdAt: Time!
}

type RevisionEdge {
  node: Revision!
  cursor: Cursor!
}

type RevisionConnection {
  edges: [RevisionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Series {
  id: ID!
  author: Actor!

  title: String!
  description: String
  slug: String!
  coverImageUrl: String

  isComplete: Boolean!
  articleCount: Int!

  createdAt: Time!
  updatedAt: Time!
}

type SeriesEdge {
  node: Series!
  cursor: Cursor!
}

type SeriesConnection {
  edges: [SeriesEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Category {
  id: ID!
  name: String!
  slug: String!
  description: String
  parent: Category
  children: [Category!]!

  articleCount: Int!
  order: Int!
  color: String

  createdAt: Time!
  updatedAt: Time!
}

type Publication {
  id: ID!
  name: String!
  tagline: String
  description: String
  slug: String!

  logoUrl: String
  bannerUrl: String
  customDomain: String

  actor: Actor!
  members: [PublicationMember!]!

  createdAt: Time!
  updatedAt: Time!
}

type PublicationMember {
  user: Actor!
  role: PublicationRole!
  displayName: String
  bio: String
  joinedAt: Time!
}

# ============================================================
# Presigned-companion upload grants (M3)
# One-time, hash-bound, actor-scoped upload admission. The mint returns a
# presigned S3 PUT bound to the declared content type and the declared sha256
# of the intended bytes; finalize verifies the stored object's actual digest
# before any editorial media record exists.
# ============================================================

"""A one-time, hash-bound, actor-scoped upload grant minted by the owner."""
type UploadGrant {
  id: ID!
  ownerId: ID!
  """Declared media type, bound into the presigned PUT."""
  contentType: String!
  """Declared size cap; finalize fails closed beyond it."""
  maxSizeBytes: Int!
  """Hex-encoded sha256 of the exact bytes the caller will PUT."""
  declaredSha256: String!
  status: UploadGrantStatus!
  """Presigned PUT URL. Populated at mint and refreshed while the grant is minted."""
  presignedUrl: String
  """Media ID minted with the grant; set once the finalize admits the asset."""
  mediaId: ID
  grantedAt: Time!
  """Bounded expiry; expired grants authorize no PUT or finalize."""
  expiresAt: Time!
  usedAt: Time
  """Set on a digest-failure finalize so the owner can inspect why an upload was not admitted."""
  failureReason: String
}

enum UploadGrantStatus {
  MINTED
  USED
  EXPIRED
  FAILED_DIGEST
}

input MintUploadGrantInput {
  contentType: String!
  maxSizeBytes: Int!
  """Hex-encoded sha256 of the exact bytes the caller will PUT."""
  sha256: String!
}

"""The internal editorial media record admitted by a successful finalize."""
type UploadGrantMedia {
  mediaId: ID!
  contentType: String!
  size: Int!
  """Canonical sha256:<hex> content integrity of the exact admitted bytes."""
  contentHash: String!
  status: String!
  visibility: String!
}

type UploadGrantFinalizeResult {
  grant: UploadGrant!
  media: UploadGrantMedia!
}

extend type Query {
  # Draft operations
  draft(id: ID!): Draft
  draftPreview(id: ID!): DraftPreview!
  myDrafts(contentType: ObjectType, status: DraftStatus, first: Int, after: Cursor): DraftConnection!
  """Review assignments created by the authenticated draft owner."""
  myDraftReviews(first: Int, after: Cursor): DraftReviewConnection!
  sharedDraftReviews(first: Int, after: Cursor): DraftReviewConnection!
  draftReview(id: ID!): DraftReview
  """Issue a short-lived read for one exact asset bound to an authorized draft."""
  draftEditorialMediaAccess(draftId: ID!, mediaId: ID!): EditorialMediaAccess!
  """One upload grant with its inspectable lifecycle state (owner-scoped)."""
  uploadGrant(grantId: ID!): UploadGrant!

  # Revision history
  revisions(objectId: ID!, first: Int, after: Cursor): RevisionConnection!
  revision(objectId: ID!, version: Int!): Revision

  # Article queries
  article(id: ID!): Article
  articleBySlug(slug: String!): Article
  """List published articles, optionally filtering public article text with a case-insensitive substring search."""
  articles(authorId: ID, seriesId: ID, categoryId: ID, search: String, first: Int, after: Cursor): ArticleConnection!

  # Series
  series(id: ID!): Series
  seriesBySlug(slug: String!): Series
  allSeries(authorId: ID, first: Int, after: Cursor): SeriesConnection!

  # Categories
  category(id: ID!): Category
  categoryBySlug(slug: String!): Category
  categories(parentId: ID): [Category!]!
  rootCategories: [Category!]!

  # Publication
  publication(id: ID!): Publication
  publicationBySlug(slug: String!): Publication
  myPublications: [Publication!]!
}

extend type Mutation {
  # Draft lifecycle
  createDraft(input: CreateDraftInput!): Draft!
  updateDraft(id: ID!, input: UpdateDraftInput!): Draft!
  """Replace the complete ordered editorial-media association for a draft."""
  setDraftEditorialMedia(draftId: ID!, media: [EditorialMediaUsageInput!]!): Draft!
  autosaveDraft(id: ID!, content: String!): Draft!
  deleteDraft(id: ID!): Boolean!

  # Presigned-companion upload grants
  """Mint a one-time, hash-bound upload grant with a presigned PUT URL."""
  mintUploadGrant(input: MintUploadGrantInput!): UploadGrant!
  """Verify the uploaded bytes against the grant and admit the editorial media record."""
  finalizeUploadGrant(grantId: ID!): UploadGrantFinalizeResult!

  # Publishing
  publishDraft(id: ID!): Article!
  scheduleDraft(id: ID!, scheduledAt: Time!): Draft!
  cancelScheduledDraft(id: ID!): Draft!
  shareDraftForReview(draftId: ID!, reviewer: String!): DraftReview!
  revokeDraftReview(draftId: ID!, reviewer: String!): Boolean!
  submitDraftReview(draftId: ID!, verdict: DraftReviewVerdict!, notes: String): DraftReview!

  # Article operations
  createArticle(input: CreateArticleInput!): Article!
  updateArticle(id: ID!, input: UpdateArticleInput!): Article!
  deleteArticle(id: ID!): Boolean!

  # Revision operations
  restoreRevision(objectId: ID!, version: Int!): Article!

  # Series management
  createSeries(input: CreateSeriesInput!): Series!
  updateSeries(id: ID!, input: UpdateSeriesInput!): Series!
  deleteSeries(id: ID!): Boolean!
  addArticleToSeries(seriesId: ID!, articleId: ID!, order: Int): Series!
  removeArticleFromSeries(seriesId: ID!, articleId: ID!): Series!
  reorderSeriesArticles(seriesId: ID!, articleIds: [ID!]!): Series!

  # Category management
  createCategory(input: CreateCategoryInput!): Category!
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!
  addArticleToCategory(categoryId: ID!, articleId: ID!): Article!
  removeArticleFromCategory(categoryId: ID!, articleId: ID!): Article!

  # Publication management
  createPublication(input: CreatePublicationInput!): Publication!
  updatePublication(id: ID!, input: UpdatePublicationInput!): Publication!
  invitePublicationMember(publicationId: ID!, userId: ID!, role: PublicationRole!): PublicationMember!
  removePublicationMember(publicationId: ID!, userId: ID!): Boolean!
  updatePublicationMemberRole(publicationId: ID!, userId: ID!, role: PublicationRole!): PublicationMember!
}

