  HTML
  MARKDOWN
}

enum DraftStatus {
  DRAFT
  SCHEDULED
  PUBLISHING
  PUBLISHED
  FAILED
}

enum ChangeType {
  CREATE
  UPDATE
  RESTORE
}

enum PublicationRole {
  OWNER
  EDITOR
  WRITER
  CONTRIBUTOR
}

type TOCEntry {
  id: String!
