  lastHostRequestId: String
}

type SoulBootstrapErrorState {
  code: String!
  message: String!
  source: String
  statusCode: Int
  detailsJson: String
  hostRequestId: String
  recoveryCategory: SoulBootstrapRecoveryCategory
  recoveryAction: SoulBootstrapRecoveryAction
  retryable: Boolean!
  restartRequired: Boolean!
  at: Time
}

type SoulBootstrapState {
  username: String!
  bodyId: ID!
  hostRegistrationId: ID
  hostConversationId: ID
  hostSoulAgentId: ID
  walletAddress: String
  principalAddress: String
  bootstrapMode: SoulBootstrapMode!
  authorityModel: SoulBootstrapAuthorityModel!
  anchorState: SoulBootstrapAnchorState
  assuranceState: SoulBootstrapAnchorState
  phase: SoulBootstrapPhase!
  state: String!
  hostConversationStatus: String
  typedNextAction: SoulBootstrapNextAction!
  recoveryCategory: SoulBootstrapRecoveryCategory
  recoveryAction: SoulBootstrapRecoveryAction
  retryable: Boolean!
  restartRequired: Boolean!
  restartAvailable: Boolean!
  availableActions: [SoulBootstrapNextAction!]!
  hostedGenesisConversation: SoulBootstrapHostedGenesisConversation
  signingCheckpoints: [SoulBootstrapSigningCheckpoint!]!
  terminalDeclarationEvidence: SoulBootstrapTerminalDeclarationEvidence
  publication: SoulBootstrapPublicationEvidence
  publicationEvidence: SoulBootstrapPublicationEvidence
  publishGate: SoulBootstrapPublishGate!
  error: SoulBootstrapErrorState
  correlation: SoulBootstrapCorrelationState
  recoveryAttemptId: ID
  restartIdempotencyKey: String
  lastHostRequestId: String
  restartedAt: Time
  updatedAt: Time
}

type SoulBootstrapSurface {
  username: String!
  body: SoulBootstrapIdentityTarget!
  workflow: AgentWorkflowSurface!
  state: SoulBootstrapState!
  soulBindingState: SoulBindingState!
  existingSoulAgentId: ID
  hostBridgeAvailable: Boolean!
  executable: Boolean!
  nextAction: String
  typedNextAction: SoulBootstrapNextAction!
  availableActions: [SoulBootstrapNextAction!]!
  recoveryCategory: SoulBootstrapRecoveryCategory
  recoveryAction: SoulBootstrapRecoveryAction
  retryable: Boolean!
  restartAvailable: Boolean!
