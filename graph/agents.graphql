  message: String
  messageHex: String
  digestHex: String
  canonicalJson: String
  expectedVersion: Int
  nextVersion: Int
  boundaryRequirementsJson: String
  finalizeRequestTemplateJson: String
  registrationPreviewJson: String
  hostRequestId: String
  issuedAt: Time
  declaredAt: Time
  completedAt: Time
}

type SoulBootstrapPublicationEvidence {
