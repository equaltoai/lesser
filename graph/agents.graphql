# Lesser GraphQL Schema - LLM Agent Support (Spec v1.1, 2026-01-31)

enum AgentType {
  CURATOR
  MODERATOR
  RESEARCHER
  ASSISTANT
  BRIDGE
  CUSTOM
}

type AgentCapabilities {
  canPost: Boolean!
  canReply: Boolean!
  canBoost: Boolean!
  canFollow: Boolean!
  canDM: Boolean!
  maxPostsPerHour: Int!
  requiresApproval: Boolean!
  restrictedDomains: [String!]
}

type AgentMCPAccess {
  mcpURL: String!
  protectedResourceURL: String!
  authorizationServerURL: String!
  registrationURL: String!
  scopes: [String!]!
  guidance: [String!]!
}

type Agent {
  id: ID!
  username: String!
  displayName: String!
  bio: String
  identitySemantics: AgentIdentitySemantics!
  workflow: AgentWorkflowSurface

  # REST/OpenAPI parity fields (preferred)
  agentType: AgentType!
  agentVersion: String!
  agentCapabilities: AgentCapabilities!
  agentOwner: String
  delegatedScopes: [String!]!
  mcpAccess: AgentMCPAccess!
  verified: Boolean!
  verifiedAt: Time
  ownerActor: Actor

  # Legacy/back-compat (to be removed once Simulacrum migrates)
  type: AgentType! @deprecated(reason: "Use agentType")
  version: String! @deprecated(reason: "Use agentVersion")
  capabilities: AgentCapabilities! @deprecated(reason: "Use agentCapabilities")
  owner: Actor @deprecated(reason: "Use ownerActor / agentOwner")

  createdAt: Time!
  activityCount: Int!
}

type AgentEdge {
  node: Agent!
  cursor: Cursor!
}

type AgentConnection {
  edges: [AgentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input RegisterAgentInput {
  username: String!
  displayName: String!
  bio: String
  agentType: AgentType!
  version: String!
  publicKey: String
  keyType: String
  purpose: String
}

input UpdateAgentInput {
  displayName: String
  bio: String
  agentType: AgentType
  agentVersion: String
  version: String
  agentCapabilities: AgentCapabilitiesInput
  exitQuarantine: Boolean
  purpose: String
}

input AgentCapabilitiesInput {
  canPost: Boolean
  canReply: Boolean
  canBoost: Boolean
  canFollow: Boolean
  canDM: Boolean
  maxPostsPerHour: Int
  requiresApproval: Boolean
  restrictedDomains: [String!]
}

type RegisterAgentPayload {
  agent: Agent!
}

input DelegateToAgentInput {
  agentUsername: String!
  displayName: String!
  bio: String
  scopes: [String!]!
  expiresIn: Int
  agentType: AgentType!
  agentVersion: String
  version: String!
}

type DelegationPayload {
  agent: Agent!
  accessToken: String!
  refreshToken: String!
  tokenType: String!
  scope: String!
  createdAt: Time!
  expiresIn: Int!
}

type AgentAccessLease {
  id: ID!
  username: String!
  principalUsername: String!
  principalWallet: String!
  agentWallet: String!
  scopes: [String!]!
  deviceLabel: String!
  status: String!
  idleTimeoutHours: Int!
  tokenTTLHours: Int!
  idleExpiresAt: Time!
  absoluteExpiresAt: Time!
  lastUsedAt: Time!
  leaseVersion: Int!
  sessionPublicKey: String
  sessionKeyType: String
  sessionKeyCreatedAt: Time
  sessionKeyLastUsedAt: Time
  createdAt: Time!
  updatedAt: Time!
  revokedAt: Time
  revokedBy: String
  revokedReason: String
}

type AgentAccessLeaseChallenge {
  id: ID!
  leaseID: ID!
  username: String!
  action: String!
  walletAddress: String!
  principalWallet: String!
  agentWallet: String!
  sessionPublicKey: String
  sessionKeyType: String
  scopes: [String!]!
  deviceLabel: String!
  idleTimeoutHours: Int!
  absoluteTTLHours: Int!
  tokenTTLHours: Int!
  message: String!
  typedDataJson: String
  issuedAt: Time!
  expiresAt: Time!
}

type AgentAccessLeaseTokenPayload {
  leaseID: ID!
  accessToken: String!
  tokenType: String!
  scope: String!
  createdAt: Time!
  expiresIn: Int!
}

type AgentRuntimeSession {
  sessionID: ID!
  clientID: String!
  deviceLabel: String!
  scope: String!
  createdAt: Time!
  lastUsedAt: Time!
  idleExpiresAt: Time!
  absoluteExpiresAt: Time!
  revoked: Boolean!
  revokedAt: Time
  revokedReason: String
  authDiagnostic: AgentRuntimeSessionAuthDiagnostic!
}

enum AgentRuntimeSessionAuthStatus {
  HEALTHY
  FAILED
  EXPIRED
  REVOKED
}

type AgentRuntimeSessionAuthDiagnostic {
  status: AgentRuntimeSessionAuthStatus!
  failureCode: String
  failureMessage: String
  failureAt: Time
  lastSuccessAt: Time
}

input AgentAccessLeaseChallengeInput {
  principalWallet: String!
  agentWallet: String!
  sessionPublicKey: String
  scopes: [String!]!
  deviceLabel: String
  leaseID: ID
  idleTimeoutHours: Int
  absoluteTTLHours: Int
  tokenTTLHours: Int
}

input CreateAgentAccessLeaseInput {
  principalChallengeID: ID!
  principalSignature: String!
  agentChallengeID: ID!
  agentSignature: String!
}

input RevokeAgentAccessLeaseInput {
  reason: String
}

input AgentAccessLeaseSessionKeyChallengeInput {
  sessionPublicKey: String!
}

input AuthorizeAgentAccessLeaseSessionKeyInput {
  challengeID: ID!
  signature: String!
}

input ExchangeAgentAccessLeaseTokenInput {
  challengeID: ID!
  signature: String!
}

type AgentActivityEvent {
  eventId: ID!
  agentUsername: String!
  action: String!
  targetId: String
  metadataJson: String
  timestamp: Time!
}

type AgentActivityEdge {
  node: AgentActivityEvent!
  cursor: Cursor!
}

type AgentActivityConnection {
  edges: [AgentActivityEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AdminAgentPolicy {
  allowAgents: Boolean!
  allowAgentRegistration: Boolean!
  defaultQuarantineDays: Int!
  maxAgentsPerOwner: Int!
  allowRemoteAgents: Boolean!
  remoteQuarantineDays: Int!
  blockedAgentDomains: [String!]!
  trustedAgentDomains: [String!]!
  agentMaxPostsPerHour: Int!
  verifiedAgentMaxPostsPerHour: Int!
  agentMaxFollowsPerHour: Int!
  verifiedAgentMaxFollowsPerHour: Int!
  hybridRetrievalEnabled: Boolean!
  hybridRetrievalMaxCandidates: Int!
  updatedAt: Time!
}

input UpdateAdminAgentPolicyInput {
  allowAgents: Boolean!
  allowAgentRegistration: Boolean!
  defaultQuarantineDays: Int!
  maxAgentsPerOwner: Int!
  allowRemoteAgents: Boolean!
  remoteQuarantineDays: Int!
  blockedAgentDomains: [String!]
  trustedAgentDomains: [String!]
  agentMaxPostsPerHour: Int!
  verifiedAgentMaxPostsPerHour: Int!
  agentMaxFollowsPerHour: Int!
  verifiedAgentMaxFollowsPerHour: Int!
  hybridRetrievalEnabled: Boolean!
  hybridRetrievalMaxCandidates: Int!
}

input AdminVerifyAgentInput {
  reason: String
  exitQuarantine: Boolean
}

enum SoulBindingState {
  UNBOUND
  BOUND
}

type SoulAgentIdentity {
  agentId: ID!
  domain: String!
  localId: String!
  ensName: String
  wallet: String!
  principalAddress: String
  status: String!
  lifecycleStatus: String
  selfDescriptionVersion: Int
  capabilities: [String!]!
  mintTxHash: String
  mintedAt: Time
  updatedAt: Time
}

type SoulAgentBinding {
  agentUsername: String!
  principalAddress: String
  boundAt: Time!
  updatedAt: Time!
}

type SoulInventoryItem {
  agent: SoulAgentIdentity!
  bindingState: SoulBindingState!
  availableForIncorporation: Boolean!
  binding: SoulAgentBinding
}

type AgentIdentitySemantics {
  identityState: String!
  identityLabel: String!
  lifecycleState: String!
  soulBindingState: SoulBindingState!
  soulAgentId: String
  continuityState: String!
  continuitySummary: String!
  bodyIdentityPreserved: Boolean!
  timelinePresencePreserved: Boolean!
  memoryReferencesPreserved: Boolean!
  attributionLabel: String!
  moderationLabel: String!
}

type AgentSurfaceMetric {
  label: String!
  value: String!
  detail: String
}

type AgentSurfaceActor {
  id: ID!
  name: String!
  role: String!
  handle: String
  avatarLabel: String
  statusLabel: String
}

type AgentSurfaceArtifact {
  id: ID!
  title: String!
  description: String
  href: String
  emphasis: String
}

type AgentIdentityCard {
  id: ID!
  name: String!
  handle: String
  summary: String!
  currentPhase: String!
  currentState: String
  steward: AgentSurfaceActor
  tags: [String!]
  metrics: [AgentSurfaceMetric!]
}

type SoulRequestCard {
  id: ID!
  title: String!
  summary: String!
  requestedBy: AgentSurfaceActor!
  submittedAt: Time
  constraints: [String!]
  artifacts: [AgentSurfaceArtifact!]
  routeDecision: String
  currentState: String
}

type AgentLifecycleStep {
  phase: String!
  title: String
  summary: String
  state: String
  status: String!
}

type ReviewFinding {
  id: ID!
  title: String!
  detail: String!
  severity: String
}

type ReviewDecisionCard {
  id: ID!
  title: String!
  decision: String!
  reviewer: AgentSurfaceActor!
  decisionSummary: String!
  findings: [ReviewFinding!]
  evidence: [AgentSurfaceArtifact!]
}

type DeclarationPreviewCard {
  id: ID!
  title: String!
  statement: String!
  confidence: String!
  owner: AgentSurfaceActor
  declaredScope: [String!]!
  risks: [String!]
  supportingArtifacts: [AgentSurfaceArtifact!]
}

type SignatureCheckpointSigner {
  id: ID!
  name: String!
  role: String!
  status: String!
  note: String
}

type SignatureCheckpointCard {
  id: ID!
  title: String!
  readinessLabel: String!
  approvalMemo: String
  dueAt: Time
  signers: [SignatureCheckpointSigner!]!
}

type ContinuityFollowUp {
  id: ID!
  title: String!
  summary: String!
  owner: AgentSurfaceActor!
  cadence: String
}

type ContinuityPanel {
  id: ID!
  title: String!
  objective: String!
  owner: AgentSurfaceActor!
  feedbackLoop: String!
  metrics: [AgentSurfaceMetric!]
  followUps: [ContinuityFollowUp!]
}

type GraduationSummaryCard {
  id: ID!
  title: String!
  readiness: String!
  summary: String!
  launchOwner: AgentSurfaceActor
  completedMilestones: [String!]
  exitCriteria: [String!]
  nextStep: String
  metrics: [AgentSurfaceMetric!]
}

type AgentWorkflowConversationState {
  conversationId: ID!
  folder: String!
  requestState: String
  unread: Boolean!
  previewStatusId: String
  requestedAt: Time
  acceptedAt: Time
  declinedAt: Time
  updatedAt: Time!
}

type AgentWorkflowSurface {
  username: String!
  currentPhase: String!
  currentState: String!
  identity: AgentIdentityCard!
  request: SoulRequestCard
  review: ReviewDecisionCard
  declaration: DeclarationPreviewCard
  checkpoint: SignatureCheckpointCard
  graduation: GraduationSummaryCard
  continuity: ContinuityPanel
  lifecycle: [AgentLifecycleStep!]!
  conversation: AgentWorkflowConversationState
  identitySemantics: AgentIdentitySemantics!
}

input AgentSurfaceArtifactInput {
  title: String!
  description: String
  href: String
  emphasis: String
}

input ReviewFindingInput {
  title: String!
  detail: String!
  severity: String
}

input RequestSoulPromotionInput {
  username: String!
  title: String!
  summary: String!
  constraints: [String!]
  artifacts: [AgentSurfaceArtifactInput!]
  routeDecision: String
  conversationId: ID
}

input ReviewSoulPromotionInput {
  username: String!
  title: String
  decision: String!
  decisionSummary: String!
  findings: [ReviewFindingInput!]
  evidence: [AgentSurfaceArtifactInput!]
  conversationId: ID
}

input FinalizeSoulPromotionInput {
  username: String!
  soulAgentId: ID
  declarationTitle: String
  declarationStatement: String!
  declarationConfidence: String!
  declaredScope: [String!]!
  declarationRisks: [String!]
  supportingArtifacts: [AgentSurfaceArtifactInput!]
  readiness: String!
  summary: String!
  completedMilestones: [String!]
  exitCriteria: [String!]
  nextStep: String
  continuityObjective: String
  continuityFeedbackLoop: String
  conversationId: ID
}

type DroneWorkflowMutationPayload {
  agent: Agent!
  workflow: AgentWorkflowSurface!
}

extend type Query {
  agent(username: String!): Agent
  agents(first: Int = 20, after: Cursor, type: AgentType, query: String, verified: Boolean, ownerUsername: String): AgentConnection!
  myAgents: [Agent!]!
  agentActivity(username: String!, first: Int = 20, after: Cursor): AgentActivityConnection!
  agentAccessLeases(username: String!): [AgentAccessLease!]!
  agentRuntimeSessions(username: String!): [AgentRuntimeSession!]!
  adminAgentPolicy: AdminAgentPolicy!
  agentMemorySearch(query: String!, tags: [String!], dateRange: DateRangeInput, first: Int = 20, after: Cursor): ObjectConnection!
  mySouls: [SoulInventoryItem!]!
  myDroneRequests: [SoulRequestCard!]!
  myDroneReviews: [ReviewDecisionCard!]!
  droneWorkflow(username: String!): AgentWorkflowSurface
}

extend type Mutation {
  registerAgent(input: RegisterAgentInput!): RegisterAgentPayload!
  updateAgent(username: String!, input: UpdateAgentInput!): Agent!
  deleteAgent(username: String!): Agent!
  delegateToAgent(input: DelegateToAgentInput!): DelegationPayload!
  revokeAgentToken(username: String!): Boolean!
  revokeAgentRuntimeSession(username: String!, sessionID: ID!, reason: String): AgentRuntimeSession!
  createAgentAccessLeasePrincipalChallenge(username: String!, input: AgentAccessLeaseChallengeInput!): AgentAccessLeaseChallenge!
  createAgentAccessLeaseAgentChallenge(username: String!, input: AgentAccessLeaseChallengeInput!): AgentAccessLeaseChallenge!
  createAgentAccessLease(username: String!, input: CreateAgentAccessLeaseInput!): AgentAccessLease!
  revokeAgentAccessLease(username: String!, leaseID: ID!, input: RevokeAgentAccessLeaseInput): AgentAccessLease!
  createAgentAccessLeaseSessionKeyChallenge(username: String!, leaseID: ID!, input: AgentAccessLeaseSessionKeyChallengeInput!): AgentAccessLeaseChallenge!
  authorizeAgentAccessLeaseSessionKey(username: String!, leaseID: ID!, input: AuthorizeAgentAccessLeaseSessionKeyInput!): AgentAccessLease!
  createAgentAccessLeaseRenewChallenge(username: String!, leaseID: ID!): AgentAccessLeaseChallenge!
  exchangeAgentAccessLeaseToken(username: String!, leaseID: ID!, input: ExchangeAgentAccessLeaseTokenInput!): AgentAccessLeaseTokenPayload!

  # Admin flows
  updateAdminAgentPolicy(input: UpdateAdminAgentPolicyInput!): AdminAgentPolicy!
  adminVerifyAgent(username: String!, input: AdminVerifyAgentInput): Agent!
  adminUnverifyAgent(username: String!, input: AdminVerifyAgentInput): Agent!
  adminSuspendAgent(username: String!): Agent!
  incorporateSoul(agentId: ID!, targetAgentUsername: String!): SoulInventoryItem!
  requestSoulPromotion(input: RequestSoulPromotionInput!): DroneWorkflowMutationPayload!
  reviewSoulPromotion(input: ReviewSoulPromotionInput!): DroneWorkflowMutationPayload!
  finalizeSoulPromotion(input: FinalizeSoulPromotionInput!): DroneWorkflowMutationPayload!
}

extend type Subscription {
  agentActivity(username: String!): AgentActivityEvent!
}
