enum SoulBootstrapPhase {
  NOT_STARTED
  BEGIN
  WALLET_VERIFICATION
  PRINCIPAL_DECLARATION
  CONVERSATION
  FINALIZE
  COMPLETE
  ERROR
}

enum SoulBootstrapMode {
  HOSTED
  WALLET_PRINCIPAL
}

enum SoulBootstrapAuthorityModel {
  INSTANCE_TRUST
  WALLET_PRINCIPAL
}

enum SoulBootstrapAnchorState {
  HOSTED_OFFCHAIN
  IMMUTABLE_ONCHAIN
}

enum SoulBootstrapNextAction {
  START_HOSTED_BOOTSTRAP
  SEND_HOSTED_SOUL_GENESIS_MESSAGE
  COMPLETE_HOSTED_SOUL_GENESIS
  PUBLISH_HOSTED_SOUL
  RESTART_SOUL_BOOTSTRAP
  RETRY_SAME_STEP
  REFRESH_STATE
  OPERATOR_ACTION_REQUIRED
  VERIFY_WALLET
  PREPARE_PRINCIPAL_DECLARATION
  VERIFY_PRINCIPAL_DECLARATION
  CONTINUE_CONVERSATION
  FINALIZE
  COMPLETE
}

enum SoulBootstrapRecoveryCategory {
  RETRY_SAME_STEP
  RESTART_REQUIRED
  OPERATOR_ACTION_REQUIRED
  REFRESH_STATE
}

enum SoulBootstrapRecoveryAction {
  RETRY_SAME_STEP
  RESTART_BOOTSTRAP
  CONTACT_OPERATOR
  REFRESH_STATE
}

type SoulBootstrapIdentityTarget {
  username: String!
  bodyId: ID!
  displayName: String
  owner: AgentSurfaceActor
}

type SoulBootstrapSigningCheckpoint {
  version: String
