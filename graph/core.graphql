  hideTotals: Boolean
}

type Poll {
  id: ID!
  expiresAt: Time
  expired: Boolean!
  multiple: Boolean!
  hideTotals: Boolean!
  votesCount: Int!
  votersCount: Int!
  voted: Boolean!
  ownVotes: [Int!]
  options: [PollOption!]!
}

type PollOption {
  title: String!
  votesCount: Int!
}

# Enhanced Search types
type SearchResult {
  accounts: [Actor!]!
  statuses: [Object!]!
  hashtags: [Tag!]!
}

type AccountSuggestion {
  account: Actor!
  source: SuggestionSource!
  reason: String
}

enum SuggestionSource {
  STAFF
  PAST_INTERACTIONS
  GLOBAL
  SIMILAR_PROFILES
}

# Directory type for profile discovery
type ProfileDirectory {
  accounts: [Actor!]!
  totalCount: Int!
}

# Relationship type
type Relationship {
  id: ID!
