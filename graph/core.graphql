input GroupingStrategyInput {
  timeWindowHours: Int
  maxGroupSize: Int
  minGroupSize: Int
  sampleSize: Int
  groupByType: Boolean
  groupByTarget: Boolean
}

input GroupedNotificationsInput {
  types: [String!]
  excludeTypes: [String!]
  first: Int = 20
  after: Cursor
  includeAll: Boolean = false
  options: GroupingStrategyInput
}

type GroupedNotificationGroup {
  id: ID!
  type: String!
  groupKey: String!
  count: Int!
  latestCreatedAt: Time!
  earliestCreatedAt: Time!
  read: Boolean!
  summary: String!
  sampleActors: [Actor!]!
  sampleActorIds: [ID!]!
  targetStatusId: ID
  mostRecentNotificationId: ID
  allNotificationIds: [ID!]!
}
