# Lesser GraphQL Schema

scalar Time
scalar Cursor
scalar Upload

# Enums
enum TimelineType {
  HOME
  PUBLIC
  LOCAL
  HASHTAG
  LIST
  DIRECT
  ACTOR
}

enum ActorType {
  PERSON
  GROUP
  APPLICATION
  SERVICE
  ORGANIZATION
}

enum ObjectType {
  NOTE
  ARTICLE
  IMAGE
  VIDEO
  QUESTION
  EVENT
  PAGE
}

enum Visibility {
  PUBLIC
  UNLISTED
  FOLLOWERS
  DIRECT
}

enum Period {
  HOUR
  DAY
  WEEK
  MONTH
  YEAR
}

enum ActivityType {
  CREATE
  UPDATE
  DELETE
  FOLLOW
  LIKE
  ANNOUNCE
  UNDO
  ACCEPT
  REJECT
  FLAG
}

enum TrustCategory {
  CONTENT
  BEHAVIOR
  TECHNICAL
}

# Core Types
type Actor {
  id: ID!
  username: String!
  domain: String
  displayName: String
  summary: String
  avatar: String
  header: String
  followers: Int!
  following: Int!
  statusesCount: Int!
  bot: Boolean!
  locked: Boolean!
  createdAt: Time!
  updatedAt: Time!
  fields: [Field!]!
  
  # Lesser enhancements
  isAgent: Boolean!
  agentInfo: Agent
  tipAddress: String
  tipChainId: Int
  trustScore: Float!
  reputation: Reputation
  vouches: [Vouch!]!
}

type ViewerRole {
  role: String!
  isAdmin: Boolean!
}

type Field {
  name: String!
  value: String!
  verifiedAt: Time
}

type Object {
  id: ID!
  type: ObjectType!
  actor: Actor!
  content: String!
  contentMap: [ContentMap!]!
  inReplyTo: Object
  visibility: Visibility!
  sensitive: Boolean!
  spoilerText: String
  attachments: [Attachment!]!
  tags: [Tag!]!
  mentions: [Mention!]!
  createdAt: Time!
  updatedAt: Time!
  poll: Poll
  
  # Engagement metrics
  repliesCount: Int!
  likesCount: Int!
  sharesCount: Int!
  boosted: Boolean!
  viewerFavourited: Boolean!
  viewerBookmarked: Boolean!
  viewerPinned: Boolean!
  relationshipType: ObjectRelationshipType!
  boostedObject: Object

  # Lesser enhancements
  contentHash: String!
  estimatedCost: Int!
  moderationScore: Float
  communityNotes: [CommunityNote!]!
  agentAttribution: AgentPostAttribution
  
  # Quote Posts extensions
  quoteUrl: String
  quoteable: Boolean!
  quotePermissions: QuotePermission!
  quoteContext: QuoteContext
  quoteCount: Int!
  quotes(first: Int, after: String): QuoteConnection!
}

type AgentPostAttribution {
  triggerType: String
  triggerDetails: String
  memoryCitations: [String!]
  delegatedBy: String
  delegatedByDid: String
  scopes: [String!]
  constraints: [String!]
  schemaVersion: String
  modelId: String
  identityState: String
  identityLabel: String
  continuityState: String
  continuitySummary: String
  soulAgentId: String
  moderationLabel: String
}

input AgentPostAttributionInput {
  triggerType: String
  triggerDetails: String
  memoryCitations: [String!]
  delegatedBy: String
  delegatedByDid: String
  scopes: [String!]
  constraints: [String!]
  schemaVersion: String
  modelId: String
}

type ContentMap {
  language: String!
  content: String!
}

type Attachment {
  id: ID!
  type: String!
  url: String!
  preview: String
  description: String
  blurhash: String
  width: Int
  height: Int
  duration: Float
}

type Tag {
  name: String!
  url: String!
}

type Mention {
  id: ID!
  username: String!
  domain: String
  url: String!
}

enum ObjectRelationshipType {
  ORIGINAL
  BOOST
}

type Activity {
  id: ID!
  type: ActivityType!
  actor: Actor!
  object: Object
  target: Object
  published: Time!
  
  # Lesser enhancement
  cost: Int!
}

# Connections for pagination
type ObjectConnection {
  edges: [ObjectEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ObjectEdge {
  node: Object!
  cursor: Cursor!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

type ActorListPage {
  actors: [Actor!]!
  nextCursor: Cursor
  totalCount: Int!
}

# Domain block pagination
type DomainBlockPage {
  domains: [String!]!
  nextCursor: Cursor
  totalCount: Int!
}

# Markers (timeline positions)
enum MarkerTimeline {
  HOME
  NOTIFICATIONS
}

type Marker {
  lastReadId: ID!
  updatedAt: Time!
  version: Int!
}

type MarkerSet {
  home: Marker
  notifications: Marker
}

input SaveMarkerInput {
  timeline: MarkerTimeline!
  lastReadId: ID!
}

# Account quote permissions (Mastodon compatibility)
type AccountQuotePermissions {
  username: String!
  allowPublic: Boolean!
  allowFollowers: Boolean!
  allowMentioned: Boolean!
  blockList: [String!]!
}

input UpdateAccountQuotePermissionsInput {
  allowPublic: Boolean
  allowFollowers: Boolean
  allowMentioned: Boolean
  blockList: [String!]
}

# Account registration (passwordless)
input RegisterAccountInput {
  username: String!
  locale: String
  agreement: Boolean!
  reason: String
  defaultPostingVisibility: Visibility
}

type RegisterAccountPayload {
  actor: Actor!
  created: Boolean!
}

# Instance Metrics
type InstanceMetrics {
  activeUsers: Int!
  requestsPerMinute: Int!
  averageLatencyMs: Float!
  storageUsedGB: Float!
  estimatedMonthlyCost: Float!
  lastUpdated: Time!
}

type CostBreakdown {
  period: Period!
  totalCost: Float!
  dynamoDBCost: Float!
  s3StorageCost: Float!
  lambdaCost: Float!
  dataTransferCost: Float!
  breakdown: [CostItem!]!
}

type CostItem {
  operation: String!
  count: Int!
  cost: Float!
}

# Trust & Moderation
type TrustEdge {
  from: Actor!
  to: Actor!
  category: TrustCategory!
  score: Float!
  updatedAt: Time!
}

type ModerationDecision {
  id: ID!
  object: Object!
  decision: String!
  confidence: Float!
  evidence: [String!]!
  reviewers: [Actor!]!
  timestamp: Time!
}

#
# Moderation + reputation parity (REST endpoints)
#

input ModerationReviewInput {
  eventId: ID!
  action: String!
  severity: Int!
  confidence: Float!
  notes: String
}

type ModerationReviewResult {
  reviewId: ID!
  eventId: ID!
  action: String!
  reviewedAt: Time!
}

type ModerationHistoryEvent {
  id: ID!
  eventType: String!
  objectId: ID!
  objectType: String!
  actorId: ID!
  category: String!
  severity: Int!
  confidenceScore: Float!
  reason: String
  createdAt: Time!
  updatedAt: Time!
}

type ModerationHistoryDecision {
  id: ID!
  eventId: ID!
  objectId: ID!
  action: String!
  consensusScore: Float!
  reviewerCount: Int!
  trustWeightTotal: Float!
  decidedAt: Time!
}

type ModerationHistoryTimelineEntry {
  timestamp: Time!
  type: String!
  event: ModerationHistoryEvent
  decision: ModerationHistoryDecision
}

type ModerationHistoryResult {
  objectId: ID!
  events: [ModerationHistoryEvent!]!
  decisions: [ModerationHistoryDecision!]!
  timeline: [ModerationHistoryTimelineEntry!]!
  currentStatus: String!
  lastUpdated: Time!
}

type ModerationConsensusReview {
  reviewerId: ID!
  reviewerDomain: String
  action: String!
  confidence: Float!
  trustWeight: Float!
  reviewedAt: Time!
}

type ModerationConsensusResult {
  eventId: ID!
  objectId: ID!
  category: String!
  severity: Int!
  confidenceScore: Float!
  reviews: [ModerationConsensusReview!]!
  reviewerCount: Int!
  consensusScore: Float
  decision: String
  decidedAt: Time
}

type TrustCategoryScore {
  category: String!
  score: Float!
}

type ModerationTrustScore {
  actorId: ID!
  actorDomain: String
  overallScore: Float!
  scores: [TrustCategoryScore!]!
  trusterCount: Int!
  calculatedAt: Time!
}

input CreateReportInput {
  accountId: ID!
  statusIds: [ID!]
  comment: String
  category: String
  forward: Boolean
  ruleIds: [Int!]
}

type Report {
  id: ID!
  actionTaken: Boolean!
  actionTakenAt: Time
  category: String!
  comment: String
  forwarded: Boolean!
  createdAt: Time!
  statusIds: [ID!]!
  ruleIds: [Int!]!
  targetAccount: Actor
}

input CreateVouchInput {
  to: ID!
  confidence: Float!
  context: String
}

type CommunityNote {
  id: ID!
  author: Actor!
  content: String!
  helpful: Int!
  notHelpful: Int!
  createdAt: Time!
}

# Community note connection for pagination
type CommunityNoteConnection {
  edges: [CommunityNoteEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommunityNoteEdge {
  node: CommunityNote!
  cursor: Cursor!
}

# Notification type
type Notification {
  id: ID!
  type: String! # follow, mention, favourite, reblog
  account: Actor! # Who triggered the notification
  status: Object # Related status (if any)
  communication: CommunicationNotification
  read: Boolean!
  createdAt: Time!
}

type CommunicationNotification {
  channel: String!
  from: CommunicationFrom!
  to: CommunicationTo
  attachments: [CommunicationAttachment!]!
  subject: String
  body: String
  receivedAt: Time!
  messageId: String!
  inReplyTo: String
  threadId: String!
}

type CommunicationFrom {
  address: String!
  displayName: String
  soulAgentId: String
}

type CommunicationTo {
  address: String!
}

type CommunicationAttachment {
  id: ID!
  filename: String!
  contentType: String!
  sizeBytes: Int!
  sha256: String!
}

# Status edit history entry (Mastodon compatibility)
type StatusEdit {
  content: String!
  spoilerText: String
  sensitive: Boolean!
  createdAt: Time!
  account: Actor!
}

# Translation result (Mastodon compatibility)
type TranslationResult {
  content: String!
  spoilerText: String
  detectedLanguage: String!
  provider: String!
}

# Instance info (Mastodon compatibility)
type InstanceRule {
  id: ID!
  text: String!
}

type TipsConfig {
  enabled: Boolean!
  chainId: Int
  contractAddress: String
}

type InstanceInfo {
  domain: String!
  title: String!
  shortDescription: String
  description: String!
  email: String
  version: String!
  sourceUrl: String
  streamingUrl: String
  thumbnailUrl: String
  languages: [String!]!
  registrationsOpen: Boolean!
  approvalRequired: Boolean!
  invitesEnabled: Boolean!
  userCount: Int!
  statusCount: Int!
  domainCount: Int!
  contactAccount: Actor
  rules: [InstanceRule!]!
  tips: TipsConfig!
}

type InstanceActivityEntry {
  week: String!
  statuses: Int!
  logins: Int!
  registrations: Int!
}

type InstanceDomainBlock {
  domain: String!
  digest: String!
  severity: String!
  comment: String!
}

type TranslationLanguage {
  code: String!
  name: String!
}

# Announcements (Mastodon compatibility)
type Announcement {
  id: ID!
  content: String!
  text: String!
  publishedAt: Time!
  updatedAt: Time!
  allDay: Boolean!
  startsAt: Time
  endsAt: Time
  read: Boolean!
  reactions: [AnnouncementReaction!]!
}

type AnnouncementReaction {
  name: String!
  count: Int!
  me: Boolean!
  url: String
  staticUrl: String
}

# Notification connection for pagination
type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type NotificationEdge {
  node: Notification!
  cursor: Cursor!
}

type PushSubscription {
  id: ID!
  endpoint: String!
  keys: PushSubscriptionKeys!
  alerts: PushSubscriptionAlerts!
  policy: String!
  serverKey: String
  createdAt: Time
  updatedAt: Time
}

type PushSubscriptionKeys {
  auth: String!
  p256dh: String!
}

type PushSubscriptionAlerts {
  follow: Boolean!
  favourite: Boolean!
  reblog: Boolean!
  mention: Boolean!
  poll: Boolean!
  followRequest: Boolean!
  status: Boolean!
  update: Boolean!
  adminSignUp: Boolean!
  adminReport: Boolean!
}

# Quote Posts types
type QuoteContext {
  originalAuthor: Actor!
  originalNote: Object
  quoteAllowed: Boolean!
  quoteType: QuoteType!
  withdrawn: Boolean!
}

enum QuotePermission {
  EVERYONE
  FOLLOWERS
  NONE
}

enum QuoteType {
  FULL
  PARTIAL
  COMMENTARY
  REACTION
}

type QuoteConnection {
  edges: [QuoteEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type QuoteEdge {
  node: Object!
  cursor: Cursor!
}

# Quote Posts payloads
type WithdrawQuotePayload {
  success: Boolean!
  note: Object!
  withdrawnCount: Int!
}

type UpdateQuotePermissionsPayload {
  success: Boolean!
  note: Object!
  affectedQuotes: Int!
}

# Conversation type
enum ConversationFolder {
  INBOX
  REQUESTS
}

enum DmRequestState {
  PENDING
  ACCEPTED
  DECLINED
}

type ConversationViewerMetadata {
  requestState: DmRequestState!
  requestedAt: Time
  acceptedAt: Time
  declinedAt: Time
}

type SendMessagePayload {
  conversation: Conversation!
  message: Object!
}

type Conversation {
  id: ID!
  lastStatus: Object
  unread: Boolean!
  accounts: [Actor!]!
  viewerMetadata: ConversationViewerMetadata!
  createdAt: Time!
  updatedAt: Time!
}

# List type
type List {
  id: ID!
  title: String!
  repliesPolicy: RepliesPolicy!
  exclusive: Boolean!
  accountCount: Int!
  accounts: [Actor!]!
  createdAt: Time!
  updatedAt: Time!
}

enum RepliesPolicy {
  FOLLOWED
  LIST
  NONE
}

# Media type
type Media {
  id: ID!
  type: MediaType!
  url: String!
  previewUrl: String
  description: String
  sensitive: Boolean!
  spoilerText: String
  mediaCategory: MediaCategory!
  blurhash: String
  width: Int
  height: Int
  duration: Float
  size: Int!
  mimeType: String!
  uploadedBy: Actor!
  createdAt: Time!
}

enum MediaType {
  IMAGE
  VIDEO
  AUDIO
  UNKNOWN
}

enum MediaCategory {
  IMAGE
  VIDEO
  AUDIO
  GIFV
  DOCUMENT
  UNKNOWN
}

type MediaEdge {
  node: Media!
  cursor: Cursor!
}

type MediaConnection {
  edges: [MediaEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input MediaFilterInput {
  ownerId: ID
  ownerUsername: String
  mediaType: MediaType
  mimeType: String
  since: Time
  until: Time
}

# Custom Emoji type
type CustomEmoji {
  id: ID!
  shortcode: String!
  url: String!
  staticUrl: String!
  visibleInPicker: Boolean!
  category: String
  domain: String
  createdAt: Time!
  updatedAt: Time!
}

# Scheduled Status type
type ScheduledStatus {
  id: ID!
  scheduledAt: Time!
  params: StatusParams!
  mediaAttachments: [Media!]!
  createdAt: Time!
}

type StatusParams {
  text: String!
  visibility: Visibility!
  sensitive: Boolean!
  spoilerText: String
  inReplyToId: ID
  language: String
