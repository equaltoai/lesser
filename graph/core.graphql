  followedBy: Boolean!
  blocking: Boolean!
  blockedBy: Boolean!
  muting: Boolean!
  mutingNotifications: Boolean!
  requested: Boolean!
  domainBlocking: Boolean!
  showingReblogs: Boolean!
  notifying: Boolean!
  languages: [String!]
  note: String
}

