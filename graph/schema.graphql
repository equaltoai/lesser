}

type AIStats {
  period: String!
  totalAnalyses: Int!
  toxicContent: Int!
  spamDetected: Int!
  aiGenerated: Int!
  nsfwContent: Int!
  piiDetected: Int!
  toxicityRate: Float!
  spamRate: Float!
  aiContentRate: Float!
  nsfwRate: Float!
  moderationActions: ModerationActionCounts!
}

type ModerationActionCounts {
  none: Int!
  flag: Int!
  hide: Int!
  remove: Int!
  shadowBan: Int!
  review: Int!
}

type AIAnalysisRequest {
  message: String!
  objectId: ID!
  estimatedTime: String!
}

enum Sentiment {
  POSITIVE
  NEGATIVE
  NEUTRAL
  MIXED
}

enum ModerationAction {
  NONE
  FLAG
