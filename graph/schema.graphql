# Lesser GraphQL Schema

scalar Time
scalar Cursor

# Enums
enum TimelineType {
  HOME
  PUBLIC
  LOCAL
  HASHTAG
  LIST
  DIRECT
}

enum ActorType {
  PERSON
  GROUP
  APPLICATION
  SERVICE
  ORGANIZATION
}

enum ObjectType {
  NOTE
  ARTICLE
  IMAGE
  VIDEO
  QUESTION
  EVENT
  PAGE
}

enum Visibility {
  PUBLIC
  UNLISTED
  FOLLOWERS
  DIRECT
}

enum Period {
  HOUR
  DAY
  WEEK
  MONTH
  YEAR
}

enum ActivityType {
  CREATE
  UPDATE
  DELETE
  FOLLOW
  LIKE
  ANNOUNCE
  UNDO
  ACCEPT
  REJECT
  FLAG
}

enum TrustCategory {
  CONTENT
  BEHAVIOR
  TECHNICAL
}

# Core Types
type Actor {
  id: ID!
  username: String!
  domain: String
  displayName: String
  summary: String
  avatar: String
  header: String
  followers: Int!
  following: Int!
  statusesCount: Int!
  bot: Boolean!
  locked: Boolean!
  createdAt: Time!
  updatedAt: Time!
  fields: [Field!]!
  
  # Lesser enhancements
  trustScore: Float!
  reputation: Reputation
  vouches: [Vouch!]!
}

type Field {
  name: String!
  value: String!
  verifiedAt: Time
}

type Object {
  id: ID!
  type: ObjectType!
  actor: Actor!
  content: String!
  contentMap: [ContentMap!]!
  inReplyTo: Object
  visibility: Visibility!
  sensitive: Boolean!
  spoilerText: String
  attachments: [Attachment!]!
  tags: [Tag!]!
  mentions: [Mention!]!
  createdAt: Time!
  updatedAt: Time!
  
  # Engagement metrics
  repliesCount: Int!
  likesCount: Int!
  sharesCount: Int!
  
  # Lesser enhancements
  estimatedCost: Int!
  moderationScore: Float
  communityNotes: [CommunityNote!]!
  
  # Quote Posts extensions
  quoteUrl: String
  quoteable: Boolean!
  quotePermissions: QuotePermission!
  quoteContext: QuoteContext
  quoteCount: Int!
  quotes(first: Int, after: String): QuoteConnection!
}

type ContentMap {
  language: String!
  content: String!
}

type Attachment {
  id: ID!
  type: String!
  url: String!
  preview: String
  description: String
  blurhash: String
  width: Int
  height: Int
  duration: Float
}

type Tag {
  name: String!
  url: String!
}

type Mention {
  id: ID!
  username: String!
  domain: String
  url: String!
}

type Activity {
  id: ID!
  type: ActivityType!
  actor: Actor!
  object: Object
  target: Object
  published: Time!
  
  # Lesser enhancement
  cost: Int!
}

# Connections for pagination
type ObjectConnection {
  edges: [ObjectEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ObjectEdge {
  node: Object!
  cursor: Cursor!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

# Instance Metrics
type InstanceMetrics {
  activeUsers: Int!
  requestsPerMinute: Int!
  averageLatencyMs: Float!
  storageUsedGB: Float!
  estimatedMonthlyCost: Float!
  lastUpdated: Time!
}

type CostBreakdown {
  period: Period!
  totalCost: Float!
  dynamoDBCost: Float!
  s3StorageCost: Float!
  lambdaCost: Float!
  dataTransferCost: Float!
  breakdown: [CostItem!]!
}

type CostItem {
  operation: String!
  count: Int!
  cost: Float!
}

# Trust & Moderation
type TrustEdge {
  from: Actor!
  to: Actor!
  category: TrustCategory!
  score: Float!
  updatedAt: Time!
}

type ModerationDecision {
  id: ID!
  object: Object!
  decision: String!
  confidence: Float!
  evidence: [String!]!
  reviewers: [Actor!]!
  timestamp: Time!
}

type CommunityNote {
  id: ID!
  author: Actor!
  content: String!
  helpful: Int!
  notHelpful: Int!
  createdAt: Time!
}

# Notification type
type Notification {
  id: ID!
  type: String! # follow, mention, favourite, reblog
  account: Actor! # Who triggered the notification
  status: Object # Related status (if any)
  read: Boolean!
  createdAt: Time!
}

# Notification connection for pagination
type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type NotificationEdge {
  node: Notification!
  cursor: Cursor!
}

# Quote Posts types
type QuoteContext {
  originalAuthor: Actor!
  originalNote: Object
  quoteAllowed: Boolean!
  quoteType: QuoteType!
  withdrawn: Boolean!
}

enum QuotePermission {
  EVERYONE
  FOLLOWERS
  NONE
}

enum QuoteType {
  FULL
  PARTIAL
  COMMENTARY
  REACTION
}

type QuoteConnection {
  edges: [QuoteEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type QuoteEdge {
  node: Object!
  cursor: Cursor!
}

# Quote Posts payloads
type WithdrawQuotePayload {
  success: Boolean!
  note: Object!
  withdrawnCount: Int!
}

type UpdateQuotePermissionsPayload {
  success: Boolean!
  note: Object!
  affectedQuotes: Int!
}

# Input Types
input CreateNoteInput {
  content: String!
  contentMap: [ContentMapInput!]
  inReplyToId: ID
  visibility: Visibility!
  sensitive: Boolean
  spoilerText: String
  attachmentIds: [ID!]
  mentions: [String!]
  tags: [String!]
}

input ContentMapInput {
  language: String!
  content: String!
}

input TrustInput {
  targetActorId: ID!
  category: TrustCategory!
  score: Float!
}

input FlagInput {
  objectId: ID!
  reason: String!
  evidence: [String!]
}

input CommunityNoteInput {
  objectId: ID!
  content: String!
}

input CreateQuoteNoteInput {
  content: String!
  quoteUrl: String!
  quoteType: QuoteType
  visibility: Visibility
  quoteable: Boolean
  sensitive: Boolean
  spoilerText: String
  mediaIds: [ID!]
}

# Payloads
type CreateNotePayload {
  object: Object!
  activity: Activity!
  cost: CostUpdate!
}

type FlagPayload {
  moderationId: ID!
  queued: Boolean!
}

type CommunityNotePayload {
  note: CommunityNote!
  object: Object!
}

# Updates
type CostUpdate {
  operationCost: Int!
  dailyTotal: Float!
  monthlyProjection: Float!
}

# Queries
type Query {
  # Mastodon compatibility
  actor(id: ID, username: String): Actor
  object(id: ID!): Object
  timeline(type: TimelineType!, hashtag: String, listId: ID, first: Int = 20, after: Cursor): ObjectConnection!
  search(query: String!, type: String, first: Int = 20, after: Cursor): ObjectConnection!
  notifications(types: [String!], excludeTypes: [String!], first: Int = 20, after: Cursor): NotificationConnection!
  
  # Lesser enhancements
  instanceMetrics: InstanceMetrics!
  costBreakdown(period: Period = DAY): CostBreakdown!
  trustGraph(actorId: ID!, category: TrustCategory): [TrustEdge!]!
  moderationQueue(first: Int = 20, after: Cursor): [ModerationDecision!]!
  
  # Debug endpoints
  explainObject(id: ID!): ObjectExplanation!
  federationStatus(domain: String!): FederationStatus!
  
  # AI Analysis
  aiAnalysis(objectId: ID!): AIAnalysis
  aiStats(period: Period!): AIStats!
  aiCapabilities: AICapabilities!
  
  # Hashtag Following queries
  hashtag(name: String!): Hashtag
  followedHashtags(first: Int, after: String): HashtagConnection!
  hashtagTimeline(hashtag: String!, first: Int, after: String): PostConnection!
  multiHashtagTimeline(
    hashtags: [String!]!
    mode: HashtagMode!
    first: Int
    after: String
  ): PostConnection!
  suggestedHashtags(limit: Int): [HashtagSuggestion!]!
  
  # Thread Synchronization queries
  threadContext(noteId: ID!): ThreadContext
  
  # Severed Relationships queries
  severedRelationships(
    instance: String
    first: Int
    after: String
  ): SeveredRelationshipConnection!
  
  affectedRelationships(
    severedRelationshipId: ID!
  ): AffectedRelationshipConnection!
}

# Mutations
type Mutation {
  # Mastodon compatibility
  createNote(input: CreateNoteInput!): CreateNotePayload!
  deleteObject(id: ID!): Boolean!
  likeObject(id: ID!): Activity!
  unlikeObject(id: ID!): Boolean!
  shareObject(id: ID!): Activity!
  unshareObject(id: ID!): Boolean!
  followActor(id: ID!): Activity!
  unfollowActor(id: ID!): Boolean!
  
  # Lesser enhancements
  updateTrust(input: TrustInput!): TrustEdge!
  flagObject(input: FlagInput!): FlagPayload!
  addCommunityNote(input: CommunityNoteInput!): CommunityNotePayload!
  voteCommunityNote(id: ID!, helpful: Boolean!): CommunityNote!
  
  # AI Analysis
  requestAIAnalysis(objectId: ID!, objectType: String, force: Boolean): AIAnalysisRequest!
  
  # Quote Posts mutations
  createQuoteNote(input: CreateQuoteNoteInput!): CreateNotePayload!
  withdrawFromQuotes(noteId: ID!): WithdrawQuotePayload!
  updateQuotePermissions(
    noteId: ID!
    quoteable: Boolean!
    permission: QuotePermission!
  ): UpdateQuotePermissionsPayload!
  
  # Hashtag Following mutations
  followHashtag(hashtag: String!, notifyLevel: NotificationLevel): HashtagFollowPayload!
  unfollowHashtag(hashtag: String!): UnfollowHashtagPayload!
  updateHashtagNotifications(
    hashtag: String!
    settings: HashtagNotificationSettingsInput!
  ): UpdateHashtagNotificationsPayload!
  muteHashtag(hashtag: String!, until: Time): MuteHashtagPayload!
  
  # Thread Synchronization mutations
  syncThread(noteUrl: String!, depth: Int): SyncThreadPayload!
  syncMissingReplies(noteId: ID!): SyncRepliesPayload!
  
  # Severed Relationships mutations
  acknowledgeSeverance(id: ID!): AcknowledgePayload!
  attemptReconnection(id: ID!): ReconnectionPayload!
}

# Subscriptions (via WebSocket Lambda)
type Subscription {
  # Activity streams
  activityStream(types: [ActivityType!]): Activity!
  timelineUpdates(type: TimelineType!): Object!
  
  # Lesser enhancements
  costUpdates(threshold: Int): CostUpdate!
  moderationEvents(actorId: ID): ModerationDecision!
  trustUpdates(actorId: ID!): TrustEdge!
  
  # AI Analysis
  aiAnalysisUpdates(objectId: ID): AIAnalysis!
  
  # Quote Posts subscription
  quoteActivity(noteId: ID!): QuoteActivityUpdate!
  
  # Hashtag Following subscription
  hashtagActivity(hashtags: [String!]!): HashtagActivityUpdate!
}

# Quote activity update type
type QuoteActivityUpdate {
  type: String! # "quoted", "withdrawn", "permission_changed"
  quote: Object
  quoter: Actor
  timestamp: Time!
}

# Hashtag Following types
type Hashtag {
  name: String!
  displayName: String!
  url: String!
  followerCount: Int!
  postCount: Int!
  trendingScore: Float!
  isFollowing: Boolean!
  followedAt: Time
  notificationSettings: HashtagNotificationSettings
  posts(first: Int, after: String): PostConnection!
  relatedHashtags: [Hashtag!]!
  analytics: HashtagAnalytics!
}

type HashtagNotificationSettings {
  level: NotificationLevel!
  muted: Boolean!
  mutedUntil: Time
  filters: [NotificationFilter!]!
}

enum NotificationLevel {
  ALL
  MUTUALS
  FOLLOWING
  NONE
}

type NotificationFilter {
  type: String!
  value: String!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PostEdge {
  node: Object!
  cursor: Cursor!
}

type HashtagConnection {
  edges: [HashtagEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type HashtagEdge {
  node: Hashtag!
  cursor: Cursor!
}

type HashtagSuggestion {
  hashtag: Hashtag!
  reason: String!
  score: Float!
}

type HashtagAnalytics {
  hourlyPosts: [Int!]!
  dailyPosts: [Int!]!
  topPosters: [Actor!]!
  sentiment: Float!
  engagement: Float!
}

enum HashtagMode {
  ANY    # Posts with any of the hashtags
  ALL    # Posts with all of the hashtags
}

# Hashtag Following payloads
type HashtagFollowPayload {
  success: Boolean!
  hashtag: Hashtag!
}

type UnfollowHashtagPayload {
  success: Boolean!
  hashtag: Hashtag!
}

type UpdateHashtagNotificationsPayload {
  success: Boolean!
  hashtag: Hashtag!
  settings: HashtagNotificationSettings!
}

type MuteHashtagPayload {
  success: Boolean!
  hashtag: Hashtag!
  mutedUntil: Time
}

type HashtagActivityUpdate {
  hashtag: String!
  post: Object!
  author: Actor!
  timestamp: Time!
}

input HashtagNotificationSettingsInput {
  level: NotificationLevel!
  muted: Boolean
  mutedUntil: Time
  filters: [NotificationFilterInput!]
}

input NotificationFilterInput {
  type: String!
  value: String!
}

# Debug types
type ObjectExplanation {
  object: Object!
  storageLocation: String!
  sizeBytes: Int!
  storageCost: Float!
  accessPattern: [AccessLog!]!
}

type AccessLog {
  timestamp: Time!
  operation: String!
  cost: Int!
}

type FederationStatus {
  domain: String!
  reachable: Boolean!
  lastContact: Time
  sharedInbox: String
  publicKey: String
  software: String
  version: String
}

# Reputation types
type Reputation {
  actorId: ID!
  instance: String!
  totalScore: Int!
  trustScore: Int!
  activityScore: Int!
  moderationScore: Int!
  communityScore: Int!
  calculatedAt: Time!
  version: String!
  evidence: ReputationEvidence!
  signature: String
}

type ReputationEvidence {
  totalPosts: Int!
  totalFollowers: Int!
  accountAge: Int!
  vouchCount: Int!
  trustingActors: Int!
  averageTrustScore: Float!
}

type Vouch {
  id: ID!
  from: Actor!
  to: Actor!
  confidence: Float!
  context: String!
  voucherReputation: Int!
  createdAt: Time!
  expiresAt: Time!
  active: Boolean!
  revoked: Boolean!
  revokedAt: Time
}

type PortableReputation {
  context: [String!]!
  type: String!
  actor: String!
  reputation: Reputation!
  vouches: [Vouch!]!
  issuedAt: Time!
  expiresAt: Time!
  issuer: String!
  issuerProof: String!
}

type ReputationVerificationResult {
  valid: Boolean!
  actorId: String!
  issuer: String!
  issuedAt: Time!
  expiresAt: Time!
  signatureValid: Boolean!
  notExpired: Boolean!
  issuerTrusted: Boolean!
  error: String
}

type ReputationImportResult {
  success: Boolean!
  actorId: String!
  previousScore: Int!
  importedScore: Int!
  vouchesImported: Int!
  message: String
  error: String
}

"""
AI Analysis types
"""
type AIAnalysis {
  id: ID!
  objectId: ID!
  objectType: String!
  textAnalysis: TextAnalysis
  imageAnalysis: ImageAnalysis
  aiDetection: AIDetection
  spamAnalysis: SpamAnalysis
  overallRisk: Float!
  moderationAction: ModerationAction!
  confidence: Float!
  analyzedAt: Time!
}

type TextAnalysis {
  sentiment: Sentiment!
  sentimentScores: SentimentScores!
  toxicityScore: Float!
  toxicityLabels: [String!]!
  containsPII: Boolean!
  dominantLanguage: String!
  entities: [Entity!]!
  keyPhrases: [String!]!
}

type SentimentScores {
  positive: Float!
  negative: Float!
  neutral: Float!
  mixed: Float!
}

type Entity {
  type: String!
  text: String!
  score: Float!
}

type ImageAnalysis {
  moderationLabels: [ModerationLabel!]!
  isNSFW: Boolean!
  nsfwConfidence: Float!
  violenceScore: Float!
  weaponsDetected: Boolean!
  detectedText: [String!]!
  textToxicity: Float!
  celebrityFaces: [Celebrity!]!
  deepfakeScore: Float!
}

type ModerationLabel {
  name: String!
