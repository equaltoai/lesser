  approved: Boolean!
  disabled: Boolean!
  silenced: Boolean!
  suspended: Boolean!
  actor: Actor
  reportsCount: Int!
  resolvedReportsCount: Int!
}

type AdminAccountConnection {
  accounts: [AdminAccount!]!
  nextCursor: Cursor
}

input AdminCreateUserInput {
  username: String!
  email: String
  """
  Deprecated: Lesser is passwordless; this field is ignored if provided.
  """
